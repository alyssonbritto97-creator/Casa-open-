function inicio() {
  const today = new Date(), month = S.today.slice(0, 7);
  const entries = S.expenses.filter(e => e.date.startsWith(month));
  const total = entries.reduce((n, e) => n + e.amount, 0);
  const goal = Number(S.settings.monthly_goal || 0);
  const pending = S.items.filter(i => !i.bought);
  const hs = houseStats(), al = alerts();
  const ws = monday(today), buyer = buyerFor(ws);
  const buyerName = buyer && buyer.id ? nameOf(buyer.id) : T('A definir','Por definir');
  const wd = (today.getDay() + 6) % 7, t = todayIso();
  const part = collaborationSummary();
  const progress = goal > 0 ? Math.min(100, Math.round(total * 100 / goal)) : 0;
  const c = 2 * Math.PI * 44, hcol = hs.pct >= 70 ? '#9bc53d' : hs.pct >= 40 ? '#f2c14e' : '#ff7d93';
  let h = `<section><div class="eyebrow">${T('Seu espaço, sua rotina','Tu espacio, tu rutina')}</div><h1 class="splash-title">${esc(S.settings.house_name || T('Visão geral da casa','Visión general de la casa'))}</h1><p class="splash-caption">${T('Tudo o que importa, num só lugar.','Todo lo importante, en un solo lugar.')}</p></section>`;
  h += whoPrompt();
  h += `<div class="card hero"><div class="heroRow"><div class="hring"><svg width="118" height="118" viewBox="0 0 118 118"><circle cx="59" cy="59" r="50" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="10"/><circle cx="59" cy="59" r="50" fill="none" stroke="${hcol}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(2 * Math.PI * 50 * hs.pct / 100).toFixed(1)} ${(2 * Math.PI * 50).toFixed(1)}" transform="rotate(-90 59 59)"/></svg><div><b>${hs.pct}%</b><small>${T('CASA EM DIA','CASA AL DÍA')}</small></div></div><div class="grow"><div class="eyebrow">${T('Despesas do mês','Gastos del mes')}</div><div class="hero-amount" style="font-size:28px;margin:4px 0">${gs(total)}</div><div class="mut">${goal > 0 ? T('Meta: ','Meta: ') + gs(goal) + ' · ' + progress + '%' : T('Defina uma meta em Pessoas','Defina una meta en Personas')}</div></div></div>` +
    (goal > 0 ? `<div class="progress"><i style="width:${progress}%"></i></div>` : '') + `</div>`;
  h += `<div class="statgrid">` +
    `<div class="stat" onclick="go('lista')"><div class="icon">🛒</div><strong>${pending.length}</strong><span>${T('Produtos para comprar','Productos por comprar')}</span></div>` +
    `<div class="stat" onclick="go('casa')"><div class="icon">🔧</div><strong>${hs.broken + hs.fixing + hs.watch}</strong><span>${T('Partes da casa com problema','Partes de la casa con problema')}</span></div>` +
    `<div class="stat" onclick="go('colabora')"><div class="icon">🤝</div><strong>${part.participated}/${part.participants}</strong><span>${T('Colaboraram esta semana','Colaboraron esta semana')}</span></div>` +
    `<div class="stat" onclick="go('emergencia')"><div class="icon">👥</div><strong>${activeMembers().length}</strong><span>${T('Pessoas · ','Personas · ')}${sickList().length} ${T('doente(s)','enfermo(s)')}</span></div></div>`;
  h += `<div class="card"><h2>${T('Alertas','Alertas')} (${al.length})</h2>`;
  h += al.length ? al.slice(0, 7).map(x => `<div class="alrt sev${x.sev}" onclick="${x.go}"><span>${x.ic}</span><span>${esc(x.txt)}</span></div>`).join('') + (al.length > 7 ? `<div class="mini" style="margin-top:8px">+ ${al.length - 7} ${T('outros','otros')}</div>` : '') : `<div class="empty">✅ ${T('Tudo tranquilo por enquanto.','Todo tranquilo por ahora.')}</div>`;
  h += `</div>`;
  h += `<div class="card"><div class="split-head"><h2>${T('Casa','Casa')}</h2><button class="link" onclick="go('casa')">${T('Abrir painel →','Abrir panel →')}</button></div><div class="housewrap">${houseSvg()}</div></div>`;
  h += `<div class="card"><div class="split-head"><h2>${T('Hoje na cozinha','Hoy en la cocina')}</h2><button class="link" onclick="foodSub='hoje';go('comida')">${T('Comida →','Comida →')}</button></div>` +
    mealTypes().map(([k, l]) => { const lg = mealLog(t, k), m = (S.menu || []).find(x => x.day === wd && x.meal === k), ck = cookFor(t, k); return `<div class="row"><div class="n"><b>${l}</b><span class="chip">${m ? esc(m.dish) : '—'} · ${ck ? esc(first(ck)) : T('sem cozinheiro','sin cocinero')}</span></div>${lg.done ? '<span class="badge ok">✓</span>' : '<span class="badge unk">·</span>'}</div>`; }).join('') + `</div>`;
  h += `<div class="card"><div class="split-head"><h2>${T('Quem compra nesta semana?','¿Quién compra esta semana?')}</h2><button class="link" onclick="go('semana')">${T('Ver escala →','Ver turnos →')}</button></div><div style="font-weight:900;font-size:23px">${esc(buyerName)}</div><div class="mut">${T('Semana de ','Semana del ')}${br(ws)}. ${weekShopStatus().done ? '✅ ' + T('compra da semana feita','compra de la semana hecha') : '⏳ ' + T('compra da semana pendente','compra de la semana pendiente')}</div></div>`;
  h += `<div class="card"><div class="split-head"><h2>${T('Lista de compras','Lista de compras')}</h2><button class="link" onclick="go('lista')">${T('Ver tudo →','Ver todo →')}</button></div>` +
    (pending.length ? pending.slice(0, 5).map(i => '<div class="row"><div class="n"><b>' + esc(i.name) + '</b>' + (i.qty ? '<span class="chip">' + esc(i.qty) + '</span>' : '') + '</div><span class="tiny">' + T('Pendente','Pendiente') + '</span></div>').join('') : `<div class="empty">${T('Lista em dia! Adicione o que estiver faltando.','¡Lista al día! Agregue lo que falte.')}</div>`) + `</div>`;
  h += `<div class="card"><h2>${T('Acesso rápido','Acceso rápido')}</h2><div class="quick-grid">` +
    [['casa','🏠',T('Casa','Casa')],['comida','🍲',T('Comida','Comida')],['pets','🐾','Pets'],['emergencia','🚨',T('Emergência','Emergencia')],['colabora','🤝',T('Colaboração','Colaboración')],['mais','⋯',T('Mais','Más')]].map(q => `<button class="quick" onclick="go('${q[0]}')"><b>${q[1]}</b>${q[2]}</button>`).join('') + `</div></div>`;
  if (entries.length) h += `<div class="card"><div class="split-head"><h2>${T('Últimos gastos','Últimos gastos')}</h2><button class="link" onclick="go('gastos')">${T('Detalhes →','Detalles →')}</button></div>` +
    entries.slice(0, 4).map(e => '<div class="row"><div class="n"><b>' + esc(e.note || kindName(e.kind)) + '</b><span class="chip">' + esc(e.date) + '</span></div><strong>' + gs(e.amount) + '</strong></div>').join('') + '</div>';
  return h;
}

function setLang(l) { LANG = l; store.set('casa_lang', l); document.documentElement.lang = l === 'es' ? 'es' : 'pt-BR'; lastJson = ''; render(); }
function setDefaultLang(l) { call('settings', 'POST', {lang: l}); }
function saveHouseName() { call('settings', 'POST', {house_name: val('hname')}); }
async function fillLink() {
  const box = $('#linkbox'); if (!box) return;
  let url = location.origin;
  if (isLocal) { try { const j = await api('info'); if (j.address) url = j.address; else url = ''; } catch (e) { url = ''; } }
  window.casaLink = url;
  const b = $('#linkbox'); if (!b) return;
  b.innerHTML = url ? `<div style="font-weight:900;font-size:19px;overflow-wrap:anywhere">${esc(url)}</div><div class="tg" style="margin-top:10px"><button class="btn g" onclick="copyLink()">${T('Copiar link','Copiar enlace')}</button><button class="btn o" onclick="shareLink()">${T('Compartilhar','Compartir')}</button></div>` : `<div class="mut">${T('Ligue o servidor e conecte o celular ao Wi-Fi para ver o link.','Encienda el servidor y conecte el celular al Wi-Fi para ver el enlace.')}</div>`;
}
function linkText() { return T('Open House — abra no navegador, no mesmo Wi-Fi da casa: ','Open House — abra en el navegador, en el mismo Wi-Fi de la casa: ') + (window.casaLink || ''); }
function copyLink() {
  try { navigator.clipboard.writeText(window.casaLink).then(() => alert(T('Link copiado.','Enlace copiado.')), () => prompt('', window.casaLink)); } catch (e) { alert(window.casaLink); }
}
function shareLink() { if (typeof navigator !== 'undefined' && navigator.share) navigator.share({text: linkText()}).catch(() => {}); else copyLink(); }
function backup() {
  const blob = new Blob([JSON.stringify(S, null, 2)], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'casa-backup-' + todayIso() + '.json'; document.body.appendChild(a); a.click(); a.remove();
}

  h += `<div class="card"><h2>Open House</h2><div class="mut">© Jose Brito · Converta+<br>${T('Todos os direitos reservados. Proibida a cópia, venda ou redistribuição sem autorização.','Todos los derechos reservados. Prohibida la copia, venta o redistribución sin autorización.')}</div></div>`;

// ================= ESCALA, LISTA, CARDÁPIO, PESSOAS =================
function semana() {
  const ppl = activeMembers();
  if (!ppl.length) {
    return '<div class="card hero"><h2>' + T('Bem-vindo','Bienvenido') + '</h2><div class="big">Open House</div><p class="mut">' + T('Ainda não há pessoas cadastradas.','Todavía no hay personas registradas.') +
      (token ? T(' Vá na aba <b>Pessoas</b> e cadastre quem participa da cota.',' Vaya a la pestaña <b>Personas</b> y registre a quienes participan de la cuota.') : T(' O administrador precisa cadastrar quem participa da cota.',' El administrador debe registrar a quienes participan de la cuota.')) + '</p></div>' +
      (token ? '' : '<div class="card"><div class="mut">' + T('Sou o administrador: toque em <b>Administrador</b> no topo','Soy el administrador: toque <b>Administrador</b> arriba') + (isLocal ? '' : T(' (no celular dele)',' (en su celular)')) + '.</div></div>');
  }
  const ws = monday(new Date());
  const b = buyerFor(ws);
  let h = '<button class="back" onclick="go(\'mais\')">← ' + T('Mais','Más') + '</button><div class="card hero"><h2>' + T('Quem compra esta semana','Quién compra esta semana') + '</h2>';
  if (!S.settings.start_date && !S.overrides[iso(ws)]) {
    h += '<div class="big">—</div><p class="mut">' + (token ? T('Defina a data de início da escala na aba Pessoas.','Defina la fecha de inicio de los turnos en la pestaña Personas.') : T('O administrador ainda não definiu a escala.','El administrador aún no definió los turnos.')) + '</p>';
  } else if (b && b.before) {
    h += '<div class="big">' + T('Começa em ','Empieza el ') + br(b.start) + '</div><p class="mut">' + T('A escala ainda não começou.','Los turnos todavía no empezaron.') + '</p>';
  } else if (b) {
    const end = new Date(ws); end.setDate(end.getDate() + 6);
    const left = Math.max(0, Math.round((end - new Date(new Date().getFullYear(), new Date().getMonth(), new Date().getDate())) / 864e5));
    h += '<div class="heroRow">' + avatar(b.id, true) + '<div class="grow"><div class="big">' + esc(nameOf(b.id)) + '</div>' +
         '<p class="mut" style="margin:6px 0 0">' + br(ws) + ' – ' + br(end) + ' • ' + (left === 0 ? T('último dia da semana','último día de la semana') : left + (left === 1 ? T(' dia',' día') : T(' dias',' días')) + T(' até trocar',' hasta cambiar')) + (b.swapped ? ' • ' + T('trocado pelo administrador','cambiado por el administrador') : '') + '</p></div></div>';
    if (me && String(b.id) === me) h += '<div style="margin-top:12px;position:relative;z-index:1"><span class="pill">' + T('É a sua vez','Es su turno') + '</span></div>';
  }
  if (token) {
    h += '<div style="margin-top:12px;position:relative;z-index:1"><select onchange="swap(this.value)"><option value="">' + T('Trocar quem compra esta semana…','Cambiar quién compra esta semana…') + '</option>' +
      ppl.map(m => '<option value="' + m.id + '">' + esc(m.name) + '</option>').join('') + '<option value="auto">' + T('Voltar para a escala normal','Volver al turno normal') + '</option></select></div>';
  }
  h += '</div>';
  if (S.settings.start_date) {
    h += '<div class="card"><h2>' + T('Próximas semanas','Próximas semanas') + '</h2>';
    for (let i = 1; i <= 6; i++) {
      const w = new Date(ws); w.setDate(w.getDate() + 7 * i);
      const bb = buyerFor(w);
      if (bb && bb.id) h += '<div class="row">' + avatar(bb.id) + '<div class="n"><b>' + esc(nameOf(bb.id)) + '</b></div><span class="mut">' + br(w) + '</span></div>';
    }
    h += '</div>';
  }
  const falta = S.items.filter(i => !i.bought).length;
  const mes = S.expenses.filter(e => e.date.startsWith(S.today.slice(0, 7))).reduce((a, e) => a + e.amount, 0);
  h += '<div class="card"><h2>' + T('Resumo','Resumen') + '</h2><div class="row"><div class="n">' + T('Itens que faltam','Ítems que faltan') + '</div><b>' + falta + '</b></div>' +
       '<div class="row"><div class="n">' + T('Gasto neste mês','Gasto en este mes') + '</div><b>' + gs(mes) + '</b></div></div>';
  return h;
}
function swap(v) {
  if (!v) return;
  call('overrides', 'POST', {week_start: iso(monday(new Date())), member_id: v === 'auto' ? null : Number(v)});
}
function lista() {
  const falta = S.items.filter(i => !i.bought);
  const feitos = S.items.filter(i => i.bought).slice(0, 15);
  let h = '<div class="card"><h2>' + T('Adicionar o que falta','Agregar lo que falta') + '</h2><div class="f"><div class="f2"><input id="iname" placeholder="' + T('Ex.: arroz, óleo, sabão','Ej.: arroz, aceite, jabón') + '" maxlength="60"><input id="iqty" placeholder="' + T('Qtde','Cant.') + '" maxlength="20"></div>' +
       '<button class="btn g" onclick="addItem()">' + T('Adicionar à lista','Agregar a la lista') + '</button></div></div>';
  h += '<div class="card"><h2>' + T('Falta comprar','Falta comprar') + ' (' + falta.length + ')</h2>';
  if (!falta.length) h += '<div class="empty">' + T('Nada na lista por enquanto.','Nada en la lista por ahora.') + '</div>';
  falta.forEach(i => {
    h += '<div class="row"><div class="n"><b>' + esc(i.name) + '</b><span class="chip">' + (i.qty ? esc(i.qty) + ' • ' : '') + (i.added_by ? T('pedido por ','pedido por ') + esc(nameOf(i.added_by)) : '') + '</span></div>' +
         '<button class="btn g s" onclick="bought(' + i.id + ',true)">' + T('Comprado','Comprado') + '</button>' +
         (token ? '<button class="btn r s" onclick="delItem(' + i.id + ')">' + T('Apagar','Borrar') + '</button>' : '') + '</div>';
  });
  h += '</div>';
  if (feitos.length) {
    h += '<div class="card"><h2>' + T('Comprados recentemente','Comprados recientemente') + '</h2>';
    feitos.forEach(i => {
      h += '<div class="row"><div class="n"><b style="text-decoration:line-through;color:var(--muted)">' + esc(i.name) + '</b><span class="chip">' + (i.bought_by ? T('por ','por ') + esc(nameOf(i.bought_by)) : '') + '</span></div>' +
           '<button class="btn o s" onclick="bought(' + i.id + ',false)">' + T('Desfazer','Deshacer') + '</button></div>';
    });
    h += '</div>';
  }
  return h;
}
function addItem() {
  const name = $('#iname').value.trim();
  if (!name) { alert(T('Digite o nome do item.','Escriba el nombre del producto.')); return; }
  call('items', 'POST', {name, qty: $('#iqty').value.trim(), by: byMe()});
}
function bought(id, v) { call('items/' + id + '/bought', 'POST', {by: byMe(), bought: v}); }
function delItem(id) { if (confirm(T('Apagar este item?','¿Borrar este ítem?'))) call('items/' + id, 'DELETE'); }

function cardapio() {
  const meals = S.menu || [], today = (new Date().getDay() + 6) % 7;
  const MT = mealTypes(), WD = dayNames();
  let h = '<button class="back" onclick="go(\'mais\')">← ' + T('Mais','Más') + '</button><section><div class="eyebrow">' + T('Planejamento semanal','Planificación semanal') + '</div><h1 class="splash-title">' + T('Cardápio da casa','Menú de la casa') + '</h1><p class="splash-caption">' + T('Organize as refeições e prepare sua lista de compras.','Organice las comidas y prepare su lista de compras.') + '</p></section>';
  if (token) {
    h += '<div class="card" id="meal-editor"><h2>' + T('Planejar refeição','Planificar comida') + '</h2><div class="f"><div class="f2"><select id="mday">' + WD.map((d, i) => '<option value="' + i + '"' + (i === today ? ' selected' : '') + '>' + d + '</option>').join('') + '</select>' +
    '<select id="mtype">' + MT.map(([k, n]) => '<option value="' + k + '">' + n + '</option>').join('') + '</select></div>' +
    '<input id="mdish" placeholder="' + T('Ex.: arroz, feijão e frango','Ej.: arroz, porotos y pollo') + '" maxlength="100">' +
    '<input id="mnote" placeholder="' + T('Ingredientes separados por vírgulas (opcional)','Ingredientes separados por comas (opcional)') + '" maxlength="180">' +
    '<button class="btn g" onclick="saveMeal()">' + T('Salvar no cardápio','Guardar en el menú') + '</button></div></div>';
  } else {
    h += '<div class="card"><div class="mut">' + T('O administrador pode editar as refeições. Você pode consultar o cardápio e sugerir compras.','El administrador puede editar las comidas. Usted puede consultar el menú y sugerir compras.') + '</div></div>';
  }
  WD.forEach((day, di) => {
    const ms = meals.filter(m => m.day === di);
    h += '<div class="meal-day' + (di === today ? ' today' : '') + '"><div class="meal-day-title"><span>' + day + '</span>' + (di === today ? '<span class="tiny">' + T('Hoje','Hoy') + '</span>' : '') + '</div>';
    if (!ms.length) h += '<div class="mut">' + T('Nenhuma refeição planejada.','Ninguna comida planificada.') + '</div>';
    MT.forEach(([k, label]) => {
      const m = ms.find(x => x.meal === k); if (!m) return;
      h += '<div class="meal-row"><div class="n"><small>' + label + '</small><b>' + esc(m.dish) + '</b>' + (m.note ? '<small>' + T('Ingredientes: ','Ingredientes: ') + esc(m.note) + '</small>' : '') + '</div>';
      if (token) h += '<button class="btn o s" onclick="editMeal(' + di + ',\'' + k + '\')">' + T('Editar','Editar') + '</button><button class="btn r s" onclick="deleteMeal(' + di + ',\'' + k + '\')">×</button>';
      h += '</div>';
      if (m.note) h += '<div style="text-align:right"><button class="link" onclick="addMealIngredients(' + di + ',\'' + k + '\')">' + T('+ Ingredientes na lista','+ Ingredientes a la lista') + '</button></div>';
    });
    h += '</div>';
  });
  return h;
}
function editMeal(day, meal) {
  const m = (S.menu || []).find(x => x.day === day && x.meal === meal);
  if (!m || !token) return;
  $('#mday').value = String(day); $('#mtype').value = meal; $('#mdish').value = m.dish; $('#mnote').value = m.note || '';
  $('#meal-editor').scrollIntoView({behavior: 'smooth', block: 'start'});
}
function saveMeal() {
  const dish = $('#mdish').value.trim();
  if (!dish) { alert(T('Informe o prato.','Indique el plato.')); return; }
  call('menu', 'POST', {day: Number($('#mday').value), meal: $('#mtype').value, dish, note: $('#mnote').value.trim()});
}
function deleteMeal(day, meal) {
  if (confirm(T('Apagar esta refeição do cardápio?','¿Borrar esta comida del menú?'))) call('menu?day=' + day + '&meal=' + encodeURIComponent(meal), 'DELETE');
}
async function addMealIngredients(day, meal) {
  const m = (S.menu || []).find(x => x.day === day && x.meal === meal);
  if (!m || !m.note) return;
  const names = [...new Set(m.note.split(/[,;\n]+/).map(x => x.trim()).filter(Boolean))].slice(0, 12);
  const pend = new Set(S.items.filter(x => !x.bought).map(x => x.name.toLowerCase()));
  const fresh = names.filter(x => !pend.has(x.toLowerCase()));
  if (!fresh.length) { alert(T('Os ingredientes já estão na lista de compras.','Los ingredientes ya están en la lista de compras.')); return; }
  if (!confirm(T('Adicionar ' + fresh.length + ' ingrediente(s) à lista de compras?','¿Agregar ' + fresh.length + ' ingrediente(s) a la lista de compras?'))) return;
  try {
    for (const name of fresh) await api('items', 'POST', {name, qty: '', by: byMe()});
    await load(true);
    alert(T('Ingredientes adicionados à lista de compras.','Ingredientes agregados a la lista de compras.'));
  } catch (e) { alert(errMsg(e.message)); }
}

function pessoas() {
  const ppl = activeMembers();
  let h = '<button class="back" onclick="go(\'mais\')">← ' + T('Mais','Más') + '</button><div class="card"><h2>' + T('Pessoas da cota','Personas de la cuota') + '</h2>';
  if (!ppl.length) h += '<div class="empty">' + T('Ninguém cadastrado ainda.','Nadie registrado todavía.') + '</div>';
  ppl.forEach((m, i) => {
    h += '<div class="row">' + avatar(m.id) + '<div class="n"><b>' + (i + 1) + '. ' + esc(m.name) + '</b></div>' +
         (token ? '<button class="btn o s" onclick="move(' + i + ',-1)">↑</button><button class="btn o s" onclick="move(' + i + ',1)">↓</button><button class="btn r s" onclick="delMember(' + m.id + ')">' + T('Remover','Quitar') + '</button>' : '') + '</div>';
  });
  h += '</div>';
  if (token) {
    h += '<div class="card"><h2>' + T('Cadastrar pessoa','Registrar persona') + '</h2><div class="f"><input id="mname" placeholder="' + T('Nome','Nombre') + '" maxlength="40"><button class="btn g" onclick="addMember()">' + T('Adicionar','Agregar') + '</button></div></div>';
    h += '<div class="card"><h2>' + T('Escala semanal','Turnos semanales') + '</h2><div class="mut" style="margin-bottom:8px">' + T('A ordem acima define quem compra em cada semana. Escolha a segunda-feira em que a escala começa.','El orden de arriba define quién compra cada semana. Elija el lunes en que empiezan los turnos.') + '</div>' +
         '<div class="f"><input id="sdate" type="date" value="' + esc(S.settings.start_date || '') + '"><button class="btn" onclick="saveStart()">' + T('Salvar data de início','Guardar fecha de inicio') + '</button></div></div>';
    h += '<div class="card"><h2>' + T('Meta de gasto do mês','Meta de gasto del mes') + '</h2><div class="mut" style="margin-bottom:8px">' + T('Opcional. Com a meta, a aba Finanças mostra quanto já foi usado. Deixe 0 para não usar.','Opcional. Con la meta, la pestaña Finanzas muestra cuánto se usó. Deje 0 para no usar.') + '</div>' +
         '<div class="f"><input id="goal" inputmode="numeric" placeholder="' + T('Valor em Gs','Valor en Gs') + '" value="' + esc(S.settings.monthly_goal && S.settings.monthly_goal !== '0' ? new Intl.NumberFormat(LOC()).format(Number(S.settings.monthly_goal)) : '') + '"><button class="btn" onclick="saveGoal()">' + T('Salvar meta','Guardar meta') + '</button></div></div>';
  } else {
    h += '<div class="card"><div class="mut">' + T('Só o administrador cadastra pessoas e define a escala.','Solo el administrador registra personas y define los turnos.') + '</div></div>';
  }
  return h;
}
function addMember() { const n = $('#mname').value.trim(); if (!n) { alert(T('Digite o nome.','Escriba el nombre.')); return; } call('members', 'POST', {name: n}); }
function delMember(id) { if (confirm(T('Remover esta pessoa da cota? Os gastos dela continuam registrados.','¿Quitar a esta persona de la cuota? Sus gastos siguen registrados.'))) call('members/' + id, 'DELETE'); }
function move(i, d) {
  const ids = activeMembers().map(m => m.id); const j = i + d;
  if (j < 0 || j >= ids.length) return;
  [ids[i], ids[j]] = [ids[j], ids[i]];
  call('members/reorder', 'POST', {ids});
}
function saveStart() { const v = $('#sdate').value; if (!v) { alert(T('Escolha a data.','Elija la fecha.')); return; } call('settings', 'POST', {start_date: iso(monday(parse(v)))}); }
function saveGoal() { call('settings', 'POST', {monthly_goal: Number(($('#goal').value || '0').replace(/\D/g, '')) || 0}); }

// ================= ADMINISTRADOR =================
function openLogin() {
  const firstTime = !S.pinSet;
  const box = $('#mbox');
  if (firstTime && !isLocal) {
    box.innerHTML = '<b>' + T('Administrador','Administrador') + '</b><div class="mut">' + T('O PIN ainda não foi criado. O administrador cria o PIN abrindo o Open House no próprio celular.','El PIN aún no fue creado. El administrador crea el PIN abriendo Open House en su propio celular.') + '</div><button class="btn o" onclick="closeModal()">' + T('Fechar','Cerrar') + '</button>';
  } else {
    box.innerHTML = '<b>' + (firstTime ? T('Criar PIN do administrador','Crear PIN del administrador') : T('Entrar como administrador','Entrar como administrador')) + '</b>' +
      '<div class="mut">' + (firstTime ? T('Escolha de 4 a 8 números. Só você vai usar.','Elija de 4 a 8 números. Solo usted lo usará.') : T('Digite o seu PIN.','Escriba su PIN.')) + '</div>' +
      '<input id="pin" type="password" inputmode="numeric" maxlength="8" placeholder="PIN" autocomplete="off">' +
      (firstTime ? '<input id="pin2" type="password" inputmode="numeric" maxlength="8" placeholder="' + T('Repita o PIN','Repita el PIN') + '" autocomplete="off">' : '') +
      '<div class="err" id="perr"></div><button class="btn g" onclick="doLogin(' + firstTime + ')">' + (firstTime ? T('Criar PIN','Crear PIN') : T('Entrar','Entrar')) + '</button><button class="btn o" onclick="closeModal()">' + T('Cancelar','Cancelar') + '</button>';
  }
  curSheet = null;
  $('#modal').style.display = 'flex';
}
async function doLogin(firstTime) {
  const pin = $('#pin').value.replace(/\D/g, '');
  const err = $('#perr');
  if (pin.length < 4) { err.textContent = T('Use de 4 a 8 números.','Use de 4 a 8 números.'); return; }
  if (firstTime && pin !== $('#pin2').value.replace(/\D/g, '')) { err.textContent = T('Os PINs não são iguais.','Los PIN no son iguales.'); return; }
  try {
    const r = await api(firstTime ? 'setup' : 'login', 'POST', {pin});
    token = r.token; try { sessionStorage.setItem('casa_adm', token); } catch (e) {}
    closeModal(); await load(true);
  } catch (e) { err.textContent = errMsg(e.message); }
}
function logout() { token = ''; try { sessionStorage.removeItem('casa_adm'); } catch (e) {} lastJson = ''; render(); }

// ================= CABEÇALHO, NAVEGAÇÃO, RENDER =================
function renderHeader() {
  const nm = tabNames();
  $('#admBox').innerHTML = token
    ? '<span class="pill">' + T('Administrador','Administrador') + '</span> <button class="btn o s" onclick="logout()">' + T('Sair','Salir') + '</button>'
    : '<button class="btn o s" onclick="openLogin()">' + T('Administrador','Administrador') + '</button>';
  const cur = MAIN_TABS.includes(tab) ? tab : 'mais';
  $('#nav').innerHTML = MAIN_TABS.concat(['mais']).map(k => '<button class="' + (cur === k ? 'on' : '') + '" onclick="go(\'' + k + '\')">' + nm[k] + '</button>').join('');
  // painel fixo
  const hs = houseStats(), al = alerts(), pend = S.items.filter(i => !i.bought).length;
  const tot = monthTotal(S.today.slice(0, 7)), sev0 = al.filter(x => x.sev === 0).length;
  $('#kpi').innerHTML =
    `<span class="kp ${hs.pct >= 70 ? 'good' : hs.pct >= 40 ? 'warn' : 'bad'}" onclick="go('casa')">🏠 ${hs.pct}%</span>` +
    `<span class="kp" onclick="go('gastos')">💸 ${short(tot)}</span>` +
    `<span class="kp ${pend ? 'warn' : 'good'}" onclick="go('lista')">🛒 ${pend}</span>` +
    (() => { const w = waterState(); return `<span class="kp ${w.days == null ? 'warn' : w.days < 3 ? 'bad' : w.days < 7 ? 'warn' : 'good'}" onclick="foodSub='agua';go('comida')">💧 ${w.days == null ? '?' : w.days + T('d','d')}</span>`; })() +
    `<span class="kp ${sev0 ? 'bad' : al.length ? 'warn' : 'good'}" onclick="go('inicio')">⚠ ${al.length}</span>` +
    (S.members.some(m => m.active) ? `<select class="meSel" aria-label="${T('Quem é você?','¿Quién eres?')}" onchange="setMe(this.value)">${memOpts(me, '👤 ' + T('Quem é você?','¿Quién eres?'))}</select>` : '');
  $('#kpi').innerHTML = deEmoji($('#kpi').innerHTML);
  document.title = 'Open House • ' + (S.settings.house_name || 'Better Home');
  const sub = document.querySelector('.t small'); if (sub) sub.textContent = 'BETTER HOME · PROSPEROUS HOME';
}
function go(t) { tab = t; lastJson = ''; tourId++; render(); window.scrollTo(0, 0); }
const PAGES = {inicio, casa, comida, lista, gastos: financas, mais, semana, cardapio, colabora, pessoas, pets, emergencia, config, veiculos, socorros, imovel, obras};
function render() {
  renderHeader();
  $('#view').innerHTML = deEmoji(emergBanner() + (PAGES[tab] || inicio)());
  if (tab === 'casa' && houseView === '3d' && !h3dRaf) h3dSync();
  const modal = $('#modal');
  if (curSheet && modal && modal.style.display === 'flex') $('#mbox').innerHTML = deEmoji(curSheet());
  if (tab === 'config') fillLink();
}


load(true);
setInterval(() => load(false), 2500);
</script>
</body>
