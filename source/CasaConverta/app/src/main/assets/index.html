<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1d4d">
<title>Open House • Better Home</title>
<!-- Open House © Jose Brito · Converta+. All rights reserved. -->
<style>
:root{--navy:#0B1D4D;--navy2:#08143A;--mid:#3C508F;--sky:#8FA6E0;--green:#9BC53D;--green-d:#3F7A00;--bg:#F3F5FA;--line:#D9DEEA;--muted:#5C6A8A;--red:#E5334B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--navy);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
body{padding-bottom:84px;max-width:720px;margin:0 auto}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;position:sticky;top:0;background:rgba(243,245,250,.94);backdrop-filter:blur(8px);z-index:5;border-bottom:1px solid var(--line)}
header img{height:38px;width:auto}
header .t{font-weight:900;font-size:20px;line-height:1}
header .t small{display:block;font-weight:600;font-size:10px;color:var(--muted);letter-spacing:.08em;margin-top:3px}
header .sp{flex:1}
.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:700;font-size:15px;cursor:pointer;background:var(--navy);color:#fff;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.g{background:var(--green);color:var(--navy)}
.btn.o{background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.r{background:#fff;color:var(--red);border:1px solid var(--line)}
.btn.s{padding:7px 11px;font-size:13px;border-radius:10px}
main{padding:14px 16px;display:grid;gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 6px 18px rgba(11,29,77,.05);animation:up .35s ease both}
.card.hero{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;border:0;position:relative;overflow:hidden}
.card.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,rgba(155,197,61,.28),rgba(155,197,61,0) 70%)}
.card h2{margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card.hero h2{color:#C9D3F0}
.big{font-size:34px;font-weight:900;line-height:1.1}
.mut{color:var(--muted);font-size:13px}
.hero .mut{color:#C9D3F0}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .n{flex:1;min-width:0;overflow-wrap:anywhere}
.row .n b{display:block}
.pill{display:inline-block;border-radius:99px;padding:3px 10px;font-size:12px;font-weight:700;background:var(--green);color:var(--navy)}
input,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;color:var(--navy);background:#fff;font-family:inherit}
.f{display:grid;gap:8px}
.f2{display:grid;grid-template-columns:2fr 1fr;gap:8px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav div{display:flex;width:100%;max-width:720px}
nav button{flex:1;border:0;background:none;padding:12px 4px 10px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer}
nav button.on{color:var(--navy);box-shadow:inset 0 3px 0 var(--green)}
.pos{color:var(--green-d);font-weight:800}.neg{color:var(--red);font-weight:800}
.tg{display:flex;gap:8px}.tg .btn{flex:1}
.empty{color:var(--muted);text-align:center;padding:14px 0;font-size:14px}
#modal{position:fixed;inset:0;background:rgba(11,29,77,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
#modal .box{background:#fff;border-radius:22px;padding:20px;width:100%;max-width:380px;display:grid;gap:12px}
.err{color:var(--red);font-size:14px;min-height:18px}
.chip{font-size:12px;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:11px;padding:6px 16px 0}
.av{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:none}
.av.l{width:64px;height:64px;font-size:26px;border:3px solid rgba(255,255,255,.25)}
.heroRow{display:flex;align-items:center;gap:16px;position:relative;z-index:1}
.heroRow .grow{flex:1;min-width:0}
.stack{display:flex;height:16px;border-radius:99px;overflow:hidden;gap:3px}
.stack i{display:block;height:100%;border-radius:99px;animation:up .5s ease both}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:13px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.bars{display:flex;align-items:flex-end;gap:8px;height:160px;margin-top:4px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.bars .b i{display:block;width:100%;border-radius:10px 10px 4px 4px;background:var(--navy);min-height:3px;transform-origin:bottom;animation:grow .6s ease both}
.bars .b.now i{background:var(--green)}
.bars .b span{font-size:11px;color:var(--muted);margin-top:5px}
.bars .b em{font-style:normal;font-size:10.5px;font-weight:800;margin-bottom:4px;white-space:nowrap}
.bal{height:6px;border-radius:99px;background:#E8ECF6;position:relative;margin-top:7px}
.bal::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--line)}
.bal i{position:absolute;top:0;bottom:0;border-radius:99px}
.ring{flex:none;position:relative;width:104px;height:104px}
.ring svg{display:block}
.ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ring b{font-size:22px;font-weight:900;color:#fff}
.ring small{font-size:10px;color:#C9D3F0;letter-spacing:.04em}

/* Casa+ 2: painel contemporâneo responsivo, sem alterar as ações já existentes */
:root{--navy:#182844;--navy2:#0c1b33;--mid:#375473;--sky:#dae7ef;--green:#54e1c3;--green-d:#087965;--bg:#f3f7f9;--line:#dfe8ed;--muted:#62758a;--red:#d93e61}
html,body{background:var(--bg);color:var(--navy)}
body{max-width:860px;padding-bottom:105px}
header{padding:14px 20px;background:rgba(248,251,252,.96);border-bottom:1px solid #dae4e9;box-shadow:0 2px 18px rgba(12,27,51,.04)}
header .t{font-size:22px;letter-spacing:-.05em}
header .t small{letter-spacing:.07em;color:#60849a}
.brand-mark{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(140deg,#142741,#345574);color:#7bffe0;box-shadow:0 6px 16px rgba(12,27,51,.18);font-size:22px;font-weight:900}
main{padding:20px;gap:16px}
.card{border-radius:23px;border-color:#e1e9ef;padding:19px;box-shadow:0 10px 32px rgba(29,57,88,.045)}
.card.hero{background:linear-gradient(135deg,#1b3958 0%,#0c1a35 85%)}
.card h2{font-size:12px;letter-spacing:.09em}
.btn{background:#1f3b58;border-radius:12px}
.btn.g{background:#58e3c6;color:#0d283c}
.btn:focus-visible,nav button:focus-visible{outline:3px solid #42cdae;outline-offset:2px}
input:focus,select:focus{outline:2px solid #36bba6;border-color:#36bba6}
nav{box-shadow:0 -5px 24px rgba(12,27,51,.06);background:#fcfefe}
nav div{max-width:860px;overflow-x:auto;scrollbar-width:none;justify-content:space-around}
nav div::-webkit-scrollbar{display:none}
nav button{min-width:80px;flex:1 0 auto;padding:13px 10px;color:#657990;font-size:12px;white-space:nowrap}
nav button.on{color:#087b6e;box-shadow:inset 0 3px 0 #3bd4b2;background:#effdf9}
.splash-title{font-size:28px;letter-spacing:-.06em;font-weight:900;margin:0 0 3px}
.splash-caption{font-size:14px;color:var(--muted);margin:0 0 16px}
.eyebrow{font-weight:900;font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:#91b2c1;margin-bottom:9px}
.hero-amount{font-size:36px;font-weight:950;letter-spacing:-.05em;line-height:1.12;margin:10px 0}
.hero-bottom{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;position:relative;z-index:1}
.hero-bottom span{color:#c2d9e6;font-size:12px}
.progress{height:8px;border-radius:100px;background:rgba(255,255,255,.17);overflow:hidden;margin:14px 0 8px}
.progress i{display:block;height:100%;border-radius:100px;background:#62ebc6}
.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;min-width:0}
.stat .icon{display:flex;width:34px;height:34px;align-items:center;justify-content:center;border-radius:11px;background:#eafaf5;font-size:17px}
.stat strong{display:block;font-size:23px;margin-top:13px;letter-spacing:-.04em;overflow-wrap:anywhere}
.stat span{font-size:12px;color:var(--muted);display:block;margin-top:3px}
.quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.quick{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;padding:15px 5px;border-radius:16px;background:#edf5f8;border:1px solid #dce8ec;font-size:12px;font-weight:800;color:#274763;cursor:pointer}
.quick b{font-size:23px}
.split-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.split-head h2{margin:0}
.link{border:0;background:transparent;color:#087965;font-weight:800;cursor:pointer;padding:6px;font-size:12px}
.meal-day{margin-bottom:12px;border:1px solid #e5ebf0;background:#fbfdfe;border-radius:18px;padding:14px}
.meal-day.today{border-color:#75d9c5;background:#f1fffa}
.meal-day-title{display:flex;justify-content:space-between;align-items:center;font-weight:900;margin-bottom:9px}
.meal-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.meal-row:first-of-type{border:0}
.meal-row .n{flex:1;min-width:0}
.meal-row .n small{display:block;color:#638194;margin-top:4px}
.tiny{font-size:11px;background:#e4faf4;color:#187664;border-radius:90px;padding:5px 9px;font-weight:800}
@media(max-width:420px){main{padding:12px}.card{padding:15px}.hero-amount{font-size:31px}.quick-grid{gap:6px}.quick{padding:12px 4px;font-size:11px}nav button{min-width:76px}}

.sync-tag{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:6px 9px;font-weight:800;font-size:11px;background:#e8f9f3;color:#116f5d;white-space:nowrap;border:1px solid #cbebe1}
.sync-tag::before{content:"";display:inline-block;width:7px;height:7px;background:#21b991;border-radius:50%}
.sync-tag.offline{color:#9a3650;background:#fff0f3;border-color:#f7ccd6}
.sync-tag.offline::before{background:#dd506f}
.sync-tag.wait{color:#98671c;background:#fff7e9;border-color:#f6dfad;cursor:pointer}
.sync-tag.wait::before{background:#e4a43d}
.collab-card{border:1px solid #e0eaf0;border-radius:18px;padding:14px;margin-top:10px;background:#fbfdff}
.collab-heading{display:flex;align-items:center;gap:10px}.collab-heading .n{flex:1}
.collab-row{display:flex;gap:7px;flex-wrap:wrap;padding-top:12px}
.collab-row span{font-size:12px;background:#edf4f7;border-radius:20px;padding:6px 10px;color:#37536c}
.collab-positive{font-size:12px;font-weight:800;color:#047d67}
.collab-neutral{font-size:12px;font-weight:700;color:#6a8294}
@media(max-width:410px){header{gap:8px;padding:10px}header .t{font-size:19px}header .t small{font-size:9px}.sync-tag{font-size:10px;padding:5px 7px}}

/* ===== Casa+ 3: casa animada, comida, pets, emergência, metas ===== */
:root{--amber:#e4a43d;--blue:#4a8fe0;--ok:#2fb88a;--bad:#e0455f;--card:#fff}
header .t{white-space:nowrap}
header .brandname{max-width:34vw;overflow:hidden;text-overflow:ellipsis}
#top{position:sticky;top:0;z-index:5}
header{position:static}
#kpi{display:flex;gap:6px;align-items:center;padding:7px 12px;background:rgba(252,254,254,.97);border-bottom:1px solid #dae4e9;overflow-x:auto;scrollbar-width:none}
#kpi::-webkit-scrollbar{display:none}
.kp{flex:none;display:inline-flex;align-items:center;gap:5px;border:1px solid #dce8ec;background:#f4f9fb;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:800;color:#274763;cursor:pointer;white-space:nowrap}
.kp.bad{background:#fff0f3;border-color:#f7ccd6;color:#9a3650}.kp.warn{background:#fff7e9;border-color:#f6dfad;color:#98671c}.kp.good{background:#e8f9f3;border-color:#cbebe1;color:#116f5d}
.meSel{flex:none;width:auto;max-width:130px;padding:6px 8px;font-size:12px;font-weight:800;border-radius:99px;margin-left:auto}
.pills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.pills::-webkit-scrollbar{display:none}
.pills button{flex:none;border:1px solid var(--line);background:#fff;color:#274763;border-radius:99px;padding:8px 13px;font-weight:800;font-size:13px;cursor:pointer}
.pills button.on{background:#1f3b58;color:#fff;border-color:#1f3b58}
.back{border:0;background:none;color:#087965;font-weight:800;cursor:pointer;padding:0;font-size:13px;text-align:left}
.alertbar{display:flex;gap:10px;align-items:center;border-radius:16px;padding:12px 14px;font-weight:800;font-size:14px;cursor:pointer;border:1px solid}
.alertbar.bad{background:#fff0f3;border-color:#f7ccd6;color:#8a2740}.alertbar.warn{background:#fff7e9;border-color:#f6dfad;color:#7d5314}.alertbar.info{background:#eef6ff;border-color:#cfe2f7;color:#1e4f86}
.emerg{background:linear-gradient(135deg,#9d1b36,#d93e61);color:#fff;border-radius:20px;padding:14px 16px;font-weight:800;animation:blink 2.4s ease-in-out infinite;cursor:pointer}
@keyframes blink{50%{box-shadow:0 0 0 7px rgba(217,62,97,.22)}}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ico{display:inline-flex;width:34px;height:34px;align-items:center;justify-content:center;border-radius:11px;background:#eafaf5;font-size:17px;flex:none}
.badge{display:inline-block;border-radius:99px;padding:3px 9px;font-size:11px;font-weight:800;background:#e8f1f5;color:#274763;margin:2px 4px 2px 0}
.badge.ok{background:#e0f7ee;color:#0b7a5a}.badge.watch{background:#fff3da;color:#92620f}.badge.broken{background:#ffe4ea;color:#a02343}.badge.fixing{background:#e2eefc;color:#1d558f}.badge.unk{background:#edf1f4;color:#5c6f80}.badge.crit{background:#ffe4ea;color:#a02343}
.bar{height:10px;border-radius:99px;background:#e6eef2;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .6s}
.bar.warn i{background:var(--amber)}.bar.bad i{background:var(--bad)}
.hring{width:118px;height:118px;flex:none;position:relative}.hring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.hring b{font-size:28px;font-weight:950;color:#fff;line-height:1}.hring small{font-size:10px;color:#c2d9e6;margin-top:3px}
.mini{font-size:12px;color:var(--muted)}
.sheetx{display:flex;justify-content:flex-end}
textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;color:var(--navy);background:#fff;font-family:inherit;min-height:64px;resize:vertical}
#modal{align-items:flex-start;overflow:auto}
#modal .box{max-height:none;margin:auto}
#modal .box h3{margin:0}
.stbtn{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.stbtn button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 6px;font-weight:800;font-size:13px;cursor:pointer;color:#274763}
.stbtn button.on{color:#fff;border-color:transparent}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}.chk input{width:auto}
.helpers{display:flex;flex-wrap:wrap;gap:6px}.helpers label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:6px 10px;font-size:13px;font-weight:700;cursor:pointer}.helpers label input{width:auto}
.helpers label.on{background:#e0f7ee;border-color:#9fe3c8}
.duty{display:flex;gap:8px;font-size:14px;padding:3px 0}.duty::before{content:"•";color:#087965;font-weight:900}
.qty{display:inline-flex;align-items:center;gap:6px}.qty button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900;font-size:16px;cursor:pointer;color:#274763;padding:0}
.qty b{min-width:30px;text-align:center}
.sev0{border-left:5px solid var(--bad)}.sev1{border-left:5px solid var(--amber)}.sev2{border-left:5px solid var(--blue)}
.alrt{display:flex;gap:10px;align-items:center;padding:10px 12px;margin-top:8px;border-radius:14px;background:#fbfdff;border:1px solid #e0eaf0;cursor:pointer;font-size:14px;font-weight:700}
.stars{letter-spacing:2px;color:var(--amber)}
.tabcard{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:#fff;border:1px solid var(--line);cursor:pointer;font-weight:800;color:#274763;text-align:left;width:100%;font-size:15px}
.tabcard .ico{width:42px;height:42px;font-size:21px}
.tabcard small{display:block;font-weight:600;color:var(--muted);margin-top:2px;font-size:12px}
/* casa animada */
.housewrap{border-radius:22px;overflow:hidden;border:1px solid #dae7ee;background:#cfe9f7;position:relative}
.housewrap svg{display:block;width:100%;height:auto;touch-action:manipulation}
.zn{cursor:pointer;outline:none}
.zn .f{fill:var(--c);fill-opacity:.38;stroke:var(--c);stroke-width:1.6;transition:fill-opacity .2s}
.zn:hover .f,.zn:focus .f,.zn.tour .f{fill-opacity:.72}
.zn.st-broken .f{animation:zpulse 1.3s ease-in-out infinite}
.zn.st-watch .f{animation:zpulse 2.4s ease-in-out infinite}
.zn.st-fixing .f{stroke-dasharray:5 3;animation:dash 1.2s linear infinite}
.zn .line{fill:none;stroke:var(--c);stroke-linecap:round}
.zn.tour{filter:drop-shadow(0 0 5px rgba(255,255,255,.95))}
@keyframes zpulse{50%{fill-opacity:.75}}
@keyframes dash{to{stroke-dashoffset:-16}}
@keyframes drift{from{transform:translateX(-40px)}to{transform:translateX(400px)}}
@keyframes smoke{0%{transform:translate(0,0) scale(.6);opacity:.85}100%{transform:translate(9px,-34px) scale(1.5);opacity:0}}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes sway{50%{transform:rotate(3deg)}}
@keyframes flow{to{stroke-dashoffset:-14}}
@keyframes drop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(16px);opacity:0}}
@keyframes flick{0%,100%{opacity:1}45%{opacity:.25}55%{opacity:1}70%{opacity:.4}}
@keyframes rays{to{transform:rotate(360deg)}}
@keyframes twinkle{50%{opacity:.25}}
.cloud{animation:drift 60s linear infinite}.cloud.c2{animation-duration:90s;animation-delay:-35s}
.smk{animation:smoke 3.2s ease-out infinite}.smk.s2{animation-delay:1.1s}.smk.s3{animation-delay:2.2s}
.person{animation:bob 1.8s ease-in-out infinite}
.tree{transform-origin:34px 214px;animation:sway 5s ease-in-out infinite}
.pipeflow{stroke-dasharray:4 5;animation:flow 1s linear infinite}
.drop{animation:drop 1.6s ease-in infinite}.drop.d2{animation-delay:.8s}
.flick{animation:flick 1.5s linear infinite}
.sunrays{transform-origin:310px 40px;animation:rays 40s linear infinite}
.star{animation:twinkle 3s ease-in-out infinite}
.zlabel{font-size:8px;font-weight:800;fill:#183046;pointer-events:none;paint-order:stroke;stroke:rgba(255,255,255,.75);stroke-width:2px}
.zbadge{font-size:9px;pointer-events:none}
.legend2{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin-top:10px}
.legend2 i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tourcap{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(12,27,51,.88);color:#fff;border-radius:14px;padding:10px 12px;font-size:13px;font-weight:700;display:none}
.row.link{cursor:pointer}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
@media(max-width:420px){.grid3{gap:6px}.hring{width:98px;height:98px}.hring b{font-size:24px}}
header .t small{font-size:8.5px;letter-spacing:.06em}
.brand-mark{padding:0;background:none;box-shadow:none;overflow:hidden}
.brand-mark svg{width:42px;height:42px;display:block}

<header>
  <div class="brand-mark" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#0B1D4D"/><g transform="translate(32 32.4) scale(0.112) translate(-256 -262)">
<path d="M196 372 L316 372 L392 440 L120 440Z" fill="#9BC53D"/>
<path d="M210 372 L302 372 L352 440 L160 440Z" fill="#C3E27A"/>
<rect x="328" y="108" width="38" height="70" fill="#F2EDE3"/>
<path d="M256 84 L414 212 L414 372 L98 372 L98 212Z" fill="#F2EDE3"/>
<rect x="198" y="224" width="116" height="148" rx="3" fill="#9BC53D"/>
<path d="M198 224 L246 242 L246 362 L198 372Z" fill="#0B1D4D"/></g></svg></div>

<script type="module">
import { createHouse3D } from './three/house3d.js';
window.House3D = createHouse3D();
window.__h3dReady = true;
</script>
<script>
const $ = s => document.querySelector(s);
let S = null, lastJson = '', pendingState = null, loading = false, syncOnline = false, lastSyncAt = 0;
const store = {
  get(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
let me = store.get('casa_me');
let token = '';
try { token = sessionStorage.getItem('casa_adm') || ''; } catch(e) {}
let LANG = store.get('casa_lang');
if (LANG !== 'es' && LANG !== 'pt') LANG = '';
let tab = 'inicio', period = 'mes', fsub = 'resumo', foodSub = 'hoje', curSheet = null, tourId = 0;

const lang = () => LANG || (S && S.settings && S.settings.lang) || 'pt';
const T = (pt, es) => (lang() === 'es' && es != null) ? es : pt;
const LOC = () => lang() === 'es' ? 'es-PY' : 'pt-BR';

const MAIN_TABS = ['inicio','casa','comida','lista','gastos'];
function tabNames() {
  return {inicio:T('Início','Inicio'), casa:T('Casa','Casa'), comida:T('Comida','Comida'), lista:T('Compras','Compras'), gastos:T('Finanças','Finanzas'), mais:T('Mais','Más')};
}

// ---------- API ----------
const ERR_ES = {
  'Entre como administrador.':'Entre como administrador.',
  'PIN incorreto.':'PIN incorrecto.',
  'Muitas tentativas. Espere um minuto.':'Demasiados intentos. Espere un minuto.',
  'Use de 4 a 8 números.':'Use de 4 a 8 números.',
  'O PIN já foi criado.':'El PIN ya fue creado.',
  'O PIN só pode ser criado no celular do administrador.':'El PIN solo se puede crear en el celular del administrador.',
  'Digite o nome do item.':'Escriba el nombre del producto.',
  'Digite o nome.':'Escriba el nombre.',
  'Escolha quem pagou.':'Elija quién pagó.',
  'Digite um valor maior que zero.':'Escriba un valor mayor que cero.',
  'Data inválida.':'Fecha inválida.',
  'Meta inválida.':'Meta inválida.',
  'Idioma inválido.':'Idioma inválido.',
  'Texto muito grande.':'Texto demasiado grande.',
  'Limite de registros atingido.':'Límite de registros alcanzado.',
  'Dados ausentes.':'Faltan datos.',
  'Erro interno':'Error interno',
  'Algo deu errado.':'Algo salió mal.'
};
const errMsg = m => (lang() === 'es' && ERR_ES[m]) ? ERR_ES[m] : m;

async function api(path, method, body) {
  const r = await fetch('/api/' + path, {
    method: method || 'GET',
    cache: 'no-store',
    headers: Object.assign({'Content-Type':'application/json'}, token ? {'X-Admin': token} : {}),
    body: body ? JSON.stringify(body) : undefined
  });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401 && token) { token = ''; try { sessionStorage.removeItem('casa_adm'); } catch(e) {} }
  if (!r.ok) throw new Error(j.error || 'Algo deu errado.');
  return j;
}
async function call(path, method, body) {
  try { await api(path, method, body); await load(true); } catch (e) { alert(errMsg(e.message)); }
}
// registros livres (casa, comida, pets, metas…)
const D = c => ((S && S.docs && S.docs[c]) || []);
const dk = (c, k) => D(c).find(x => x.key === k);
const clean = o => { const r = {}; Object.keys(o).forEach(k => { if (!['id','key','updated'].includes(k) && o[k] !== undefined) r[k] = o[k]; }); return r; };
function save(coll, data, opt) {
  const body = {data: clean(data)};
  if (opt && opt.id) body.id = opt.id;
  if (opt && opt.key) body.key = opt.key;
  return api('docs/' + coll, 'POST', body);
}
function del(coll, id) { return api('docs/' + coll + '/' + id, 'DELETE'); }
async function act(fn) {
  try { await fn(); await load(true); } catch (e) { alert(errMsg(e.message)); }
}
const byMe = () => me ? Number(me) : null;
function needMe() {
  if (me) return true;
  alert(T('Escolha seu nome no topo (👤) para registrar quem fez.','Elija su nombre arriba (👤) para registrar quién lo hizo.'));
  return false;
}
const val = id => { const e = $('#' + id); return e ? String(e.value).trim() : ''; };
const num = id => Number(val(id).replace(/\D/g, '')) || 0;
const dec = id => { const v = parseFloat(val(id).replace(',', '.')); return isNaN(v) ? 0 : v; };

// ---------- formatação ----------
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gs = n => 'Gs ' + new Intl.NumberFormat(LOC()).format(Math.round(n));
const short = n => n >= 1e6 ? (n/1e6).toFixed(1).replace('.',',') + ' mi' : n >= 1e3 ? Math.round(n/1e3) + ' mil' : String(Math.round(n));
const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const br = d => String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
const brs = s => s ? br(parse(s)) : '—';
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const todayIso = () => (S && S.today) || iso(new Date());
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function monday(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); const w = (x.getDay() + 6) % 7; x.setDate(x.getDate() - w); return x; }
const activeMembers = () => S.members.filter(m => m.active).sort((a,b) => a.position - b.position);
const nameOf = id => { const m = S.members.find(x => x.id === Number(id)); return m ? m.name : T('Alguém','Alguien'); };
const first = id => nameOf(id).split(/\s+/)[0];
const isLocal = ['127.0.0.1','localhost'].includes(location.hostname);
const AVC = [['#0b1d4d','#fff'],['#2c4486','#fff'],['#375473','#fff'],['#dae7ef','#0b1d4d'],['#4c7a0a','#fff'],['#9bc53d','#0b1d4d']];
function avatar(id, big) {
  const m = S.members.find(x => x.id === Number(id)); if (!m) return '';
  const [bg, fg] = AVC[(m.position - 1 + AVC.length * 10) % AVC.length];
  const ini = m.name.trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('').toUpperCase();
  return '<span class="av' + (big ? ' l' : '') + '" style="background:' + bg + ';color:' + fg + '">' + esc(ini) + '</span>';
}
const memOpts = (sel, ph) => '<option value="">' + esc(ph || '—') + '</option>' +
  activeMembers().map(m => '<option value="' + m.id + '"' + (String(m.id) === String(sel) ? ' selected' : '') + '>' + esc(m.name) + '</option>').join('');
const dayNames = () => lang() === 'es'
  ? ['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo']
  : ['Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado','Domingo'];
const mealTypes = () => lang() === 'es'
  ? [['cafe','Desayuno'],['almoco','Almuerzo'],['lanche','Merienda'],['jantar','Cena']]
  : [['cafe','Café da manhã'],['almoco','Almoço'],['lanche','Lanche'],['jantar','Jantar']];
const mealName = k => (mealTypes().find(x => x[0] === k) || [0, k])[1];
const KINDS = {compra:['Compra','Compra','#183a56'],mercado:['Mercado','Mercado','#248e77'],energia:['Energia','Energía','#9bc53d'],agua:['Água','Agua','#5a9bdf'],internet:['Internet','Internet','#8c79d9'],aluguel:['Aluguel','Alquiler','#de7984'],gas:['Gás','Gas','#ea8842'],limpeza:['Limpeza','Limpieza','#52a690'],saude:['Saúde','Salud','#b870c3'],transporte:['Transporte','Transporte','#6a9e4e'],manutencao:['Manutenção','Mantenimiento','#658caa'],outro:['Outro','Otro','#8FA6E0']};
const kindName = k => { const v = KINDS[k] || KINDS.outro; return lang() === 'es' ? v[1] : v[0]; };

function buyerFor(ws) {
  const ppl = activeMembers();
  const key = iso(ws);
  if (S.overrides[key]) return {id: S.overrides[key], swapped: true};
  if (!ppl.length || !S.settings.start_date) return null;
  const start = monday(parse(S.settings.start_date));
  const idx = Math.round((ws - start) / (7 * 864e5));
  if (idx < 0) return {before: true, start};
  return {id: ppl[((idx % ppl.length) + ppl.length) % ppl.length].id, swapped: false};
}

// ---------- sincronização ----------
function updateSyncIndicator() {
  const slot = $('#syncBox');
  if (!slot) return;
  if (!syncOnline) {
    slot.className='sync-tag offline';
    slot.textContent=T('Sem conexão','Sin conexión');
    slot.title=T('Verifique o Wi-Fi e mantenha o celular administrador ligado.','Verifique el Wi-Fi y mantenga encendido el celular del administrador.');
  } else if (pendingState) {
    slot.className='sync-tag wait';
    slot.textContent=T('Novidades · atualizar','Novedades · actualizar');
    slot.title=T('Mudanças feitas por outro celular: toque para atualizar.','Cambios hechos por otro celular: toque para actualizar.');
  } else {
    slot.className='sync-tag';
    slot.textContent=T('Sincronizado','Sincronizado');
    slot.title=T('Última atualização: ','Última actualización: ') + new Date(lastSyncAt).toLocaleTimeString(LOC());
  }
}
function hasFormFocus() {
  const el=document.activeElement;
  return !!(el && el.closest && el.closest('#view, #mbox') && ['INPUT','SELECT','TEXTAREA'].includes(el.tagName));
}
function applyState(j,txt) {
  S=j;lastJson=txt;pendingState=null;
  if(me && !S.members.some(m=>String(m.id)===me && m.active)){
    me='';store.del('casa_me');
  }
  render();
}
async function load(force) {
  if(loading || (document.hidden && !force)) return;
  loading=true;
  try {
    const j=await api('state');
    const txt=JSON.stringify(j);
    syncOnline=true;lastSyncAt=Date.now();
    if(txt!==lastJson || force) {
      if(!force && hasFormFocus())pendingState={j,txt};
      else applyState(j,txt);
    }
    updateSyncIndicator();
  } catch(e) {
    syncOnline=false;updateSyncIndicator();
    if(!S) $('#view').innerHTML='<div class="card"><b>'+T('Sem conexão com o servidor da casa.','Sin conexión con el servidor de la casa.')+'</b><div class="mut">'+T('Verifique se os celulares estão na mesma rede Wi-Fi e o administrador mantém o aplicativo ligado.','Verifique que los celulares estén en la misma red Wi-Fi y que el administrador mantenga la aplicación encendida.')+'</div></div>';
  } finally {loading=false;}
}
document.addEventListener('focusout',()=>setTimeout(()=>{
  if(pendingState && !hasFormFocus()){const p=pendingState;applyState(p.j,p.txt);updateSyncIndicator();}
},500));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load(false);});
window.addEventListener('focus',()=>load(false));
document.addEventListener('click',e=>{if(e.target && e.target.id==='syncBox')load(true);});

// ================= CASA: partes, deveres e manutenção =================

const partDef = k => PARTS.find(p => p.k === k);
// A casa tem esta parte? yes | no | future (plano). Partes essenciais sempre existem.
function partHas(k) {
  const p = partDef(k); if (!p || !p.o) return 'yes';
  const v = (dk('parts', k) || {}).has;
  return v === 'yes' || v === 'no' || v === 'future' ? v : (p.dn ? 'no' : 'yes');
}
const activeParts = () => PARTS.filter(p => partHas(p.k) === 'yes');
const optionalParts = () => PARTS.filter(p => p.o);
const pName = p => lang() === 'es' ? p.n[1] : p.n[0];

function partInfo(k) {
  const p = partDef(k), doc = dk('parts', k) || {};
  const st = doc.status || 'unk';
  const last = doc.last || '';
  const due = last ? addDays(last, p.f) : '';
  const overdue = !!due && due < todayIso();
  return {p, doc, st, last, due, overdue, resp: doc.resp || '', helpers: doc.helpers || [], note: doc.note || '', since: doc.since || ''};
}
function houseStats() {
  const all = activeParts().map(p => partInfo(p.k));
  const n = k => all.filter(x => x.st === k).length;
  const ok = n('ok');
  return {all, ok, watch: n('watch'), broken: n('broken'), fixing: n('fixing'), unk: n('unk'),
    pct: all.length ? Math.round(100 * ok / all.length) : 0,
    critBad: all.filter(x => x.p.c && (x.st === 'broken' || x.st === 'watch' || x.st === 'fixing')),
    overdue: all.filter(x => x.overdue)};
}
async function savePart(k, patch) {
  const cur = clean(dk('parts', k) || {});
  await save('parts', Object.assign(cur, patch), {key: k});
}
function setStatus(k, st) {
  const cur = dk('parts', k) || {};
  const patch = {status: st};
  if (st !== 'ok' && cur.status !== st) patch.since = todayIso();
  if (st === 'ok') patch.since = '';
  act(() => savePart(k, patch));
}
function setHas(k, v) {
  const cur = dk('parts', k) || {};
  act(() => savePart(k, {has: v, status: cur.status || 'unk'}));
}
function planWork(k) {
  const p = partDef(k), doc = dk('parts', k) || {};
  act(async () => {
    await save('works', {title: T('Construir: ','Construir: ') + pName(p), kind: 'build', part: k, status: 'plan', budget: Number(doc.est) || 0, start: '', end: '', resp: '', vendor: '', note: '', steps: [], created: todayIso()});
    go('obras');
  });
}
function setResp(k, v) { act(() => savePart(k, {resp: v ? Number(v) : ''})); }
function toggleHelper(k, id) {
  const cur = (dk('parts', k) || {}).helpers || [];
  const next = cur.includes(id) ? cur.filter(x => x !== id) : cur.concat([id]);
  act(() => savePart(k, {helpers: next}));
}
function reviewedToday(k) { act(() => savePart(k, {last: todayIso(), status: ((dk('parts', k) || {}).status) || 'ok'})); }
function saveNote(k) { act(() => savePart(k, {note: val('pnote').slice(0, 300)})); }
function partFixed(k) {
  if (!needMe()) return;
  const cost = num('pcost');
  const p = partDef(k);
  act(async () => {
    await savePart(k, {status: 'ok', last: todayIso(), since: '', note: ''});
    await save('fixlog', {type: 'fix', ref: k, title: pName(p), by: byMe(), date: todayIso(), cost, text: val('pnote').slice(0, 200)});
    if (cost > 0) await api('expenses', 'POST', {member_id: byMe(), amount: cost, kind: 'manutencao', note: pName(p), date: todayIso()});
  });
}
function partMaterial(k) {
  const name = val('pmat'); if (!name) { alert(T('Digite o material.','Escriba el material.')); return; }
  call('items', 'POST', {name: name + ' (' + pName(partDef(k)) + ')', qty: '', by: byMe()});
}

function st(s) { return s === 'broken' || s === 'watch'; }

function houseLegend() {
  return '<div class="legend2">' + ['ok','watch','broken','fixing','unk'].map(s => `<span><i style="background:${STAT[s][2]}"></i>${stName(s)}</span>`).join('') + '<span>❗ ' + T('crítica com problema','crítica con problema') + '</span></div>';
}
function startTour() {
  const ids = houseStats().all.filter(x => ['broken','fixing','watch'].includes(x.st)).sort((a, b) => (b.p.c - a.p.c) || (a.st === 'broken' ? -1 : 1));
  const id = ++tourId;
  const cap = $('#tourcap');
  if (!ids.length) { if (cap) { cap.style.display = 'block'; cap.textContent = T('Tudo em dia! Nenhuma parte com problema registrado.','¡Todo al día! Ninguna parte con problema registrado.'); setTimeout(() => { cap.style.display = 'none'; }, 3500); } return; }
  const step = n => {
    document.querySelectorAll('.zn.tour').forEach(e => e.classList.remove('tour'));
    if (id !== tourId || n >= ids.length) { if (cap) cap.style.display = 'none'; return; }
    const x = ids[n], el = document.getElementById('z-' + x.p.k);
    if (el) el.classList.add('tour');
    if (cap) {
      cap.style.display = 'block';
      cap.textContent = `${x.p.ic} ${pName(x.p)} — ${stName(x.st)}${x.p.c ? ' ❗' : ''} · ${x.resp ? T('responsável: ','responsable: ') + first(x.resp) : T('sem responsável','sin responsable')}${x.note ? ' · ' + x.note : ''}`;
    }
    setTimeout(() => step(n + 1), 3200);
  };
  step(0);
}

const CHORE_SUG = [
  ['Lavar a louça','Lavar los platos',1],['Tirar o lixo','Sacar la basura',1],['Varrer e passar pano','Barrer y trapear',7],
  ['Limpar o banheiro','Limpiar el baño',7],['Lavar roupa','Lavar la ropa',7],['Limpar a geladeira','Limpiar la heladera',30],['Regar as plantas','Regar las plantas',2],['Alimentar os pets','Dar de comer a las mascotas',1]
];
const freqName = f => f === 0 ? T('uma vez','una vez') : f === 1 ? T('todo dia','todos los días') : f === 7 ? T('toda semana','cada semana') : f === 30 ? T('todo mês','cada mes') : T('a cada ','cada ') + f + T(' dias',' días');
function choreInfo(c) {
  const t = todayIso();
  const freq = Number(c.freq || 0);
  if (freq === 0) return {done: !!c.last, next: c.due || '', late: !c.last && !!c.due && c.due < t, dueNow: !c.last};
  const next = c.last ? addDays(c.last, freq) : (c.due || t);
  return {done: c.last === t, next, late: next < t, dueNow: next <= t};
}
function addChore(title, freq) {
  title = title || val('ctitle'); if (!title) { alert(T('Digite a tarefa.','Escriba la tarea.')); return; }
  freq = freq != null ? freq : Number(val('cfreq') || 0);
  act(() => save('chores', {title: title.slice(0, 60), freq, resp: val('cresp') ? Number(val('cresp')) : '', due: val('cdue') || '', last: '', created: todayIso()}));
}
function choreDone(id) {
  if (!needMe()) return;
  const c = D('chores').find(x => x.id === id); if (!c) return;
  act(async () => {
    await save('chores', Object.assign(clean(c), {last: todayIso(), lastBy: byMe()}), {id});
    await save('fixlog', {type: 'chore', ref: String(id), title: c.title, by: byMe(), date: todayIso()});
  });
}
function choreUndo(id) {
  const c = D('chores').find(x => x.id === id); if (!c) return;
  act(() => save('chores', Object.assign(clean(c), {last: '', lastBy: ''}), {id}));
}
function choreResp(id, v) {
  const c = D('chores').find(x => x.id === id); if (!c) return;
  act(() => save('chores', Object.assign(clean(c), {resp: v ? Number(v) : ''}), {id}));
}
function choreDel(id) { if (confirm(T('Apagar esta tarefa?','¿Borrar esta tarea?'))) act(() => del('chores', id)); }
function choresHtml(compact) {
  const list = D('chores');
  let h = '';
  if (!list.length) h += `<div class="empty">${T('Nenhuma tarefa ainda. Use as sugestões abaixo.','Ninguna tarea todavía. Use las sugerencias abajo.')}</div>`;
  const sorted = list.slice().sort((a, b) => (choreInfo(b).dueNow - choreInfo(a).dueNow) || (choreInfo(b).late - choreInfo(a).late));
  sorted.slice(0, compact ? 5 : 100).forEach(c => {
    const ci = choreInfo(c), doneNow = Number(c.freq || 0) === 0 ? ci.done : ci.done;
    h += `<div class="row">${c.resp ? avatar(c.resp) : '<span class="ico">❔</span>'}<div class="n"><b${doneNow ? ' style="text-decoration:line-through;color:var(--muted)"' : ''}>${esc(c.title)}</b><span class="chip">${freqName(Number(c.freq || 0))} · ${c.resp ? esc(first(c.resp)) : T('sem responsável','sin responsable')}${c.last ? ' · ' + T('feito ','hecho ') + brs(c.last) + (c.lastBy ? ' ' + T('por ','por ') + esc(first(c.lastBy)) : '') : ''}${ci.late ? ' · <b class="neg">' + T('atrasada','atrasada') + '</b>' : ''}</span>` +
      (compact ? '' : `<select onchange="choreResp(${c.id},this.value)" style="margin-top:6px;padding:7px">${memOpts(c.resp, T('Quem faz…','Quién lo hace…'))}</select>` + collabLine(c, 'chores')) + `</div>` +

}

    `<div class="stat"><div class="icon">❗</div><strong>${hs.critBad.length}</strong><span>${T('críticas em risco','críticas en riesgo')}</span></div>` +
    `<div class="stat"><div class="icon">⏰</div><strong>${hs.overdue.length}</strong><span>${T('revisões vencidas','revisiones vencidas')}</span></div></div>`;
  // falta consertar

  todo.forEach(x => {
    h += `<div class="row link" onclick="openPart('${x.p.k}')"><span class="ico">${x.p.ic}</span><div class="n"><b>${esc(pName(x.p))}</b><span class="chip"><span class="badge ${x.st}">${stName(x.st)}</span>${x.p.c ? '<span class="badge crit">❗ ' + T('crítica','crítica') + '</span>' : ''}${x.resp ? esc(first(x.resp)) : T('sem responsável','sin responsable')}${x.note ? ' · ' + esc(x.note) : ''}</span></div></div>`;
  });
  h += `</div>`;
  // vencidas
  if (hs.overdue.length) {
    h += `<div class="card"><h2>${T('Revisões vencidas','Revisiones vencidas')}</h2>` + hs.overdue.map(x => `<div class="row link" onclick="openPart('${x.p.k}')"><span class="ico">${x.p.ic}</span><div class="n"><b>${esc(pName(x.p))}</b><span class="chip">${T('venceu em ','venció el ')}${brs(x.due)}</span></div></div>`).join('') + `</div>`;
  }
  // consertado
  const fixes = D('fixlog').filter(x => x.type === 'fix').slice(-8).reverse();
  const spent = D('fixlog').filter(x => x.type === 'fix').reduce((n, x) => n + (Number(x.cost) || 0), 0);
  h += `<div class="card"><h2>${T('O que já foi consertado','Lo que ya se arregló')}</h2>`;
  if (!fixes.length) h += `<div class="empty">${T('Ainda nenhum conserto registrado.','Todavía ningún arreglo registrado.')}</div>`;
  fixes.forEach(x => h += `<div class="row"><span class="ico">🔧</span><div class="n"><b>${esc(x.title)}</b><span class="chip">${brs(x.date)} · ${x.by ? esc(first(x.by)) : '—'}${x.cost ? ' · ' + gs(x.cost) : ''}${x.text ? ' · ' + esc(x.text) : ''}</span></div></div>`);
  if (spent) h += `<div class="mini" style="margin-top:8px">${T('Total gasto em consertos: ','Total gastado en arreglos: ')}<b>${gs(spent)}</b></div>`;
  h += `</div>`;
  // lista por parte
  h += `<div class="card"><h2>${T('Todas as partes e responsáveis','Todas las partes y responsables')}</h2>` + hs.all.map(x => `<div class="row link" onclick="openPart('${x.p.k}')"><span class="ico">${x.p.ic}</span><div class="n"><b>${esc(pName(x.p))}</b><span class="chip">${x.resp ? esc(first(x.resp)) : T('sem responsável','sin responsable')}${x.helpers.length ? ' + ' + x.helpers.map(first).map(esc).join(', ') : ''}${x.due ? ' · ' + T('revisar ','revisar ') + brs(x.due) : ''}</span></div><span class="badge ${x.st}">${stName(x.st)}</span></div>`).join('') + `</div>`;
  // o que a casa tem ou não tem, e planos futuros
  const opt = optionalParts().map(p => ({p, has: partHas(p.k), est: Number((dk('parts', p.k) || {}).est) || 0}));
  const notYet = opt.filter(x => x.has !== 'yes');
  h += `<div class="card"><h2>${T('O que a casa tem ou não tem','Lo que la casa tiene o no tiene')}</h2><div class="mini" style="margin-bottom:8px">${T('Toque para marcar: tem, não tem ou quero no futuro.','Toque para marcar: tiene, no tiene o quiero a futuro.')}</div>` + notYet.map(x => `<div class="row link" onclick="openPart('${x.p.k}')"><span class="ico">${x.p.ic}</span><div class="n"><b>${esc(pName(x.p))}</b><span class="chip"><span class="badge ${x.has === 'future' ? 'fixing' : 'unk'}">${x.has === 'future' ? T('Quero no futuro','Quiero a futuro') : T('Não tem','No tiene')}</span>${x.est ? gs(x.est) + T(' previstos',' previstos') : ''}</span></div></div>`).join('') + (notYet.length ? '' : `<div class="empty">${T('A casa tem todas as partes opcionais.','La casa tiene todas las partes opcionales.')}</div>`) + `<div class="mini" style="margin-top:8px">${T('Já tem: ','Ya tiene: ')}${opt.filter(x => x.has === 'yes').map(x => esc(pName(x.p))).join(', ') || '—'}</div>`;
  const futureCost = opt.filter(x => x.has === 'future').reduce((n, x) => n + x.est, 0);
  if (futureCost) h += `<div class="mini" style="margin-top:6px">${T('Planos futuros somam ','Planes futuros suman ')}<b>${gs(futureCost)}</b></div>`;
  h += `</div>`;
  // tarefas
  h += `<div class="card"><h2>${T('Tarefas da casa: quem faz o quê','Tareas de la casa: quién hace qué')}</h2>${choresHtml(false)}</div>`;
  h += `<div class="card"><h2>${T('Nova tarefa','Nueva tarea')}</h2>${choreForm()}</div>`;
  return h;
}

function photoPick(inp) {

    const sc = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement('canvas');

// um ingrediente "bate" com um item da despensa se alguma palavra-chave aparece no nome
function kwMatch(name, kws) {
  const n = norm(name), toks = n.split(/[^a-z0-9]+/).filter(Boolean);
  return kws.some(k => k.includes(' ') ? n.includes(k) : (k.length >= 4 ? toks.some(t => t.startsWith(k)) : toks.includes(k)));
}
const pantryHave = () => D('pantry').filter(x => Number(x.qty) > 0);
const hasIng = kws => pantryHave().some(x => kwMatch(x.name, kws));
function canCook() {
  return RECIPES.map(r => {
    const have = r.i.filter(hasIng), miss = r.i.filter(k => !hasIng(k));
    const opt = r.o.filter(hasIng).length;
    return {r, have: have.length, miss, score: have.length / r.i.length + opt * 0.02};
  }).sort((a, b) => b.score - a.score);
}
const kwLabel = (kws) => kws[0];
function essentialsStatus() {
  const rows = ESSENTIALS.map(e => ({e, ok: hasIng(e[0])}));
  return {rows, have: rows.filter(x => x.ok).length, total: rows.length};
}
function pantryLow() { return D('pantry').filter(x => Number(x.qty) <= Number(x.min || 0)); }
function pantryExp() { const t = todayIso(); return D('pantry').filter(x => x.exp && Number(x.qty) > 0 && x.exp <= addDays(t, 3)); }

function pantryAdd(name, qty, place, min) {
  name = name || val('pname'); if (!name) { alert(T('Digite o item.','Escriba el producto.')); return; }
  qty = qty != null ? qty : dec('pqty');
  act(() => save('pantry', {name: name.slice(0, 40), qty, unit: val('punit') || '', place: place || val('pplace') || 'despensa', min: min != null ? min : dec('pmin'), perMonth: dec('ppmn'), price: dec('pprc'), exp: val('pexp') || '', by: byMe()}));
}
function pantryQty(id, d) {
  const x = D('pantry').find(i => i.id === id); if (!x) return;
  const q = Math.max(0, Math.round((Number(x.qty || 0) + d) * 100) / 100);
  act(() => save('pantry', Object.assign(clean(x), {qty: q, by: byMe()}), {id}));

function pantryDel(id) { if (confirm(T('Remover este item?','¿Quitar este producto?'))) act(() => del('pantry', id)); }
function pantryAsk(id) {

  if (!fresh.length) { alert(T('Nada novo para pedir.','Nada nuevo para pedir.')); return; }

function recipeMissing(n) {
  const c = canCook()[n]; if (!c) return;
  const pend = new Set(S.items.filter(i => !i.bought).map(i => norm(i.name)));
  const names = c.miss.map(k => kwLabel(k)).filter(x => !pend.has(norm(x)));
  if (!names.length) { alert(T('Nada para adicionar.','Nada para agregar.')); return; }
  act(async () => { for (const nm of names) await api('items', 'POST', {name: nm, qty: '', by: byMe()}); });
}

// escala de quem cozinha + registro do dia
const logKey = (date, meal) => date + '|' + meal;
function rosterCook(day, meal) { const d = dk('cook', day + '|' + meal); return d ? d.m : ''; }
function mealLog(date, meal) { return dk('meallog', logKey(date, meal)) || {}; }
function cookFor(date, meal) {
  const l = mealLog(date, meal);
  if (l.cook) return l.cook;
  return rosterCook((parse(date).getDay() + 6) % 7, meal);
}
function setRoster(day, meal, v) { act(() => save('cook', {m: v ? Number(v) : ''}, {key: day + '|' + meal})); }
function setMealField(meal, field, v) {
  const t = todayIso(), cur = clean(mealLog(t, meal));
  cur[field] = field === 'done' ? !!v : (v ? Number(v) : '');
  if (field === 'done' && v) cur.doneBy = byMe();
  act(() => save('meallog', cur, {key: logKey(t, meal)}));
}
function mealBought(meal) {
  if (!needMe()) return;
  const t = todayIso(), cur = clean(mealLog(t, meal)); cur.shopper = byMe();
  act(() => save('meallog', cur, {key: logKey(t, meal)}));
}
function addShop() {
  const who = val('swho'); if (!who) { alert(T('Escolha quem comprou.','Elija quién compró.')); return; }
  const amount = num('samt'), kind = val('skind') || 'semana';
  const asExp = $('#sexp') && $('#sexp').checked && amount > 0;
  act(async () => {
    await save('shops', {kind, who: Number(who), amount, date: todayIso(), note: val('snote').slice(0, 80)});
    if (asExp) await api('expenses', 'POST', {member_id: Number(who), amount, kind: 'mercado', note: val('snote').slice(0, 80) || shopKind(kind), date: todayIso()});
  });
}
const SHOP_KINDS = [['semana','Compra da semana','Compra de la semana'],['cafe','Café da manhã','Desayuno'],['almoco','Almoço','Almuerzo'],['lanche','Lanche','Merienda'],['jantar','Jantar','Cena'],['outro','Outra','Otra']];
const shopKind = k => { const x = SHOP_KINDS.find(s => s[0] === k) || SHOP_KINDS[5]; return lang() === 'es' ? x[2] : x[1]; };
function lastShop(kind) { return D('shops').filter(s => s.kind === kind).slice(-1)[0]; }
function weekShopStatus() {
  const ws = iso(monday(new Date())), l = lastShop('semana');
  return {done: !!l && l.date >= ws, last: l};
}

      `<div class="f2"><input id="pmin" inputmode="decimal" placeholder="${T('Avisar quando ≤','Avisar cuando ≤')}"><input id="pexp" type="date" aria-label="${T('Validade','Vencimiento')}"></div><div class="f2"><input id="ppmn" inputmode="decimal" placeholder="${T('Consumo por mês','Consumo por mes')}"><input id="pprc" inputmode="decimal" placeholder="${T('Preço unitário Gs','Precio unitario Gs')}"></div><button class="btn g" onclick="pantryAdd()">${T('Salvar','Guardar')}</button></div></div>`;
    [['geladeira',T('Geladeira','Heladera'),'🧊'],['freezer','Freezer','❄️'],['despensa',T('Despensa','Despensa'),'🥫']].forEach(([pl, label, ic]) => {

      if (!items.length) h += `<div class="empty">${T('Vazio.','Vacío.')}</div>`;
      items.forEach(x => {
        const low = Number(x.qty) <= Number(x.min || 0), ex = x.exp && x.exp <= addDays(todayIso(), 3);

          (low ? `<button class="btn g s" onclick="pantryAsk(${x.id})">🛒</button>` : '') + `<button class="btn r s" onclick="pantryDel(${x.id})">×</button></div>`;
      });
      h += `</div>`;
    });
  }
  if (foodSub === 'receitas') {
    const cc = canCook(), have = pantryHave().length;
    h += `<div class="card"><h2>${T('O que dá para cozinhar agora','Qué se puede cocinar ahora')}</h2><div class="mut">${have ? T('Calculado com o que está marcado na geladeira/despensa.','Calculado con lo marcado en heladera/despensa.') : T('Cadastre os itens na aba Geladeira para ver sugestões.','Registre los productos en la pestaña Heladera para ver sugerencias.')}</div></div>`;
    cc.slice(0, 10).forEach((c, n) => {
      const full = c.miss.length === 0;
      h += `<div class="card"><div class="split-head"><h2 style="margin:0">${esc(lang() === 'es' ? c.r.n[1] : c.r.n[0])}</h2><span class="badge ${full ? 'ok' : c.have ? 'watch' : 'unk'}">${full ? T('Dá para fazer','Se puede hacer') : c.have + '/' + c.r.i.length}</span></div><div class="mini" style="margin:6px 0">${esc(lang() === 'es' ? c.r.h[1] : c.r.h[0])}</div>` +
        (c.miss.length ? `<div class="mini">${T('Falta: ','Falta: ')}<b>${c.miss.map(k => esc(kwLabel(k))).join(', ')}</b></div><button class="btn o s" style="margin-top:8px" onclick="recipeMissing(${n})">+ ${T('Faltantes na lista','Faltantes en la lista')}</button>` : '') + `</div>`;

function shopDel(id) { if (confirm(T('Apagar este registro?','¿Borrar este registro?'))) act(() => del('shops', id)); }

// ================= FINANÇAS: custo da casa, contas fixas, metas, compras futuras =================
function ringSvg(p) {
  const r = 44, c = 2 * Math.PI * r, f = Math.min(p, 1);
  const col = p > 1 ? '#FF6B7F' : '#9bc53d';
  return '<div class="ring"><svg width="104" height="104" viewBox="0 0 104 104"><circle cx="52" cy="52" r="' + r + '" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="10"/>' +
    '<circle cx="52" cy="52" r="' + r + '" fill="none" stroke="' + col + '" stroke-width="10" stroke-linecap="round" stroke-dasharray="' + (c * f).toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 52 52)"/></svg>' +
    '<div><b>' + Math.round(p * 100) + '%</b><small>' + T('DA META','DE LA META') + '</small></div></div>';
}
function prevMonth(ym) { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 2, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
const monthTotal = ym => S.expenses.filter(e => e.date.startsWith(ym)).reduce((a, e) => a + e.amount, 0);

function financas() {
  const subs = [['resumo',T('Resumo','Resumen')],['contas',T('Contas fixas','Cuentas fijas')],['metas',T('Metas','Metas')],['previsto',T('Custos previstos','Costos previstos')],['futuro',T('Compras futuras','Compras futuras')]];
  let h = `<div class="pills">` + subs.map(([k, l]) => `<button class="${fsub === k ? 'on' : ''}" onclick="fsub='${k}';go('gastos')">${l}</button>`).join('') + `</div>`;
  if (fsub === 'contas') return h + contas();
  if (fsub === 'metas') return h + metas();
  if (fsub === 'futuro') return h + futuro();
  if (fsub === 'previsto') return h + previsto();
  return h + gastos();
}

function gastos() {
  const ppl = activeMembers();
  const ym = S.today.slice(0, 7);
  const list = S.expenses.filter(e => period === 'tudo' || e.date.startsWith(ym));
  const total = list.reduce((a, e) => a + e.amount, 0);
  const ids = new Set(ppl.map(m => m.id)); list.forEach(e => ids.add(e.member_id));
  const parts = [...ids];
  const share = parts.length ? total / parts.length : 0;
  const paid = {}; parts.forEach(id => paid[id] = 0); list.forEach(e => paid[e.member_id] += e.amount);
  const goal = Number(S.settings.monthly_goal || 0);

  let h = '<div class="tg"><button class="btn ' + (period === 'mes' ? '' : 'o') + '" onclick="setPeriod(\'mes\')">' + T('Este mês','Este mes') + '</button><button class="btn ' + (period === 'tudo' ? '' : 'o') + '" onclick="setPeriod(\'tudo\')">' + T('Tudo','Todo') + '</button></div>';

  h += '<div class="card hero"><div class="heroRow"><div class="grow"><h2>' + (period === 'mes' ? T('Custo da casa no mês','Costo de la casa en el mes') : T('Total registrado','Total registrado')) + '</h2><div class="big">' + gs(total) + '</div>' +
       '<p class="mut" style="margin:8px 0 0">' + (parts.length ? T('Cota por pessoa: ','Cuota por persona: ') + gs(share) + ' (' + parts.length + T(' pessoas',' personas') + ')' : T('Cadastre as pessoas para calcular a cota.','Registre a las personas para calcular la cuota.')) + '</p>' +
       (period === 'mes' && goal > 0 ? '<p class="mut" style="margin:4px 0 0">' + T('Meta do mês: ','Meta del mes: ') + gs(goal) + '</p>' : '') +
       (period === 'mes' && goal <= 0 && token ? '<p class="mut" style="margin:4px 0 0">' + T('Defina a meta do mês na aba Pessoas.','Defina la meta del mes en la pestaña Personas.') + '</p>' : '') + '</div>' +
       (period === 'mes' && goal > 0 ? ringSvg(total / goal) : '') + '</div></div>';

  if (period === 'mes') {
    const prev = monthTotal(prevMonth(ym)), dnum = Number(S.today.slice(8, 10)) || 1;
    const diff = total - prev, pc = prev > 0 ? Math.round(100 * diff / prev) : null;
    h += `<div class="statgrid"><div class="stat"><div class="icon">📅</div><strong>${gs(total / dnum)}</strong><span>${T('por dia (média do mês)','por día (promedio del mes)')}</span></div>` +
      `<div class="stat"><div class="icon">👤</div><strong>${gs(parts.length ? total / parts.length / dnum : 0)}</strong><span>${T('por pessoa por dia','por persona por día')}</span></div>` +
      `<div class="stat"><div class="icon">${diff > 0 ? '📈' : '📉'}</div><strong class="${diff > 0 ? 'neg' : 'pos'}">${pc == null ? '—' : (diff > 0 ? '+' : '') + pc + '%'}</strong><span>${T('vs. mês passado','vs. mes pasado')} (${gs(prev)})</span></div>` +
      `<div class="stat"><div class="icon">🔮</div><strong>${gs(total / dnum * 30)}</strong><span>${T('previsão para o mês','previsión para el mes')}</span></div></div>`;
  }

  h += '<div class="card"><h2>' + T('Registrar gasto','Registrar gasto') + '</h2><div class="f">' +
       '<select id="emem"><option value="">' + T('Quem pagou?','¿Quién pagó?') + '</option>' + ppl.map(m => '<option value="' + m.id + '"' + (String(m.id) === me ? ' selected' : '') + '>' + esc(m.name) + '</option>').join('') + '</select>' +
       '<div class="f2"><input id="eval" inputmode="numeric" placeholder="' + T('Valor em Gs','Valor en Gs') + '"><select id="ekind">' + Object.keys(KINDS).map(k => '<option value="' + k + '">' + kindName(k) + '</option>').join('') + '</select></div>' +
       '<input id="enote" placeholder="' + T('Anotação (opcional)','Nota (opcional)') + '" maxlength="80">' +
       '<button class="btn g" onclick="addExp()">' + T('Salvar gasto','Guardar gasto') + '</button></div></div>';

  if (period === 'mes') h += budgetsHtml();
  if (total > 0) {
    const bykind = Object.fromEntries(Object.keys(KINDS).map(k => [k, 0])); list.forEach(e => bykind[e.kind] = (bykind[e.kind] || 0) + e.amount);
    h += '<div class="card"><h2>' + T('Gastos por tipo','Gastos por tipo') + '</h2><div class="stack">' +
      Object.keys(bykind).filter(k => bykind[k] > 0).map(k => '<i style="flex:' + bykind[k] + ';background:' + KINDS[k][2] + '"></i>').join('') + '</div><div class="legend">' +
      Object.keys(bykind).filter(k => bykind[k] > 0).map(k => '<span><span class="dot" style="background:' + KINDS[k][2] + '"></span>' + kindName(k) + ' <b>' + Math.round(bykind[k] * 100 / total) + '%</b> • ' + gs(bykind[k]) + '</span>').join('') + '</div></div>';
  }

  const w0 = monday(new Date());
  const weeks = [];
  for (let i = 5; i >= 0; i--) { const s = new Date(w0); s.setDate(s.getDate() - 7 * i); const e = new Date(s); e.setDate(e.getDate() + 6); weeks.push({s, v: 0, key: [iso(s), iso(e)]}); }
  S.expenses.forEach(e => weeks.forEach(w => { if (e.date >= w.key[0] && e.date <= w.key[1]) w.v += e.amount; }));
  const mx = Math.max(...weeks.map(w => w.v));
  h += '<div class="card"><h2>' + T('Gasto por semana','Gasto por semana') + '</h2>';
  if (mx <= 0) h += '<div class="empty">' + T('Ainda não há gastos nas últimas 6 semanas.','Todavía no hay gastos en las últimas 6 semanas.') + '</div>';
  else h += '<div class="bars">' + weeks.map((w, i) => '<div class="b' + (i === 5 ? ' now' : '') + '">' + (w.v > 0 ? '<em>' + short(w.v) + '</em>' : '') + '<i style="height:' + Math.max(2, Math.round(w.v * 100 / mx)) + '%"></i><span>' + br(w.s) + '</span></div>').join('') + '</div>';
  h += '</div>';

  if (parts.length && total > 0) {

const PET_EMO = ['🐶','🐱','🐦','🐟','🐢','🐰','🐴','🐔'];

function petFood(p) {
  if (!p.daily || !p.bagDate || p.bag == null || p.bag === '') return null;
  const used = Math.max(0, daysBetween(p.bagDate, todayIso())) * Number(p.daily) / 1000;
  const left = Math.max(0, Number(p.bag) - used);
  return {kg: left, days: Math.floor(left * 1000 / Number(p.daily))};
}

  const recs = D('petcare').filter(c => c.pet === p.id && c.kind === kind).sort((a, b) => (a.date > b.date) - (a.date < b.date));
  const last = recs[recs.length - 1];
  return {last, next: last && last.next ? last.next : ''};
}

// ================= ESTOQUE PARA 6 MESES =================
const stockGoal = () => Number((dk('flags', 'stockgoal') || {}).months) || 6;
const PER_PERSON = [['Arroz','Arroz',4,'kg'],['Feijão','Porotos',2,'kg'],['Macarrão','Fideos',2,'kg'],['Óleo','Aceite',1,'L'],['Sal','Sal',0.3,'kg'],['Açúcar','Azúcar',1.5,'kg'],['Farinha','Harina',2,'kg'],['Ovos','Huevos',20,'un'],['Leite','Leche',6,'L'],['Enlatados','Enlatados',4,'un']];
function setStockGoal(m) { act(() => save('flags', {months: Number(m)}, {key: 'stockgoal'})); }
function pantryPer(id) {
  const x = D('pantry').find(i => i.id === id); if (!x) return;
  act(() => save('pantry', Object.assign(clean(x), {perMonth: dec('ppm' + id) || Number(x.perMonth) || 0, price: dec('ppr' + id) || Number(x.price) || 0}), {id}));
}
function stockSuggest() {
  const n = Math.max(1, activeMembers().length), cur = D('pantry');
  act(async () => {
    for (const p of PER_PERSON) {
      const name = lang() === 'es' ? p[1] : p[0], per = Math.round(p[2] * n * 10) / 10;
      const ex = cur.find(x => norm(x.name) === norm(p[0]) || norm(x.name) === norm(p[1]));
      if (ex) { if (!Number(ex.perMonth)) await save('pantry', Object.assign(clean(ex), {perMonth: per, unit: ex.unit || p[3]}), {id: ex.id}); }
      else await save('pantry', {name, qty: 0, unit: p[3], place: 'despensa', min: 1, exp: '', perMonth: per, by: byMe()});
    }
  });
}
function stockRows() {
  const g = stockGoal();
  return D('pantry').filter(x => Number(x.perMonth) > 0).map(x => {
    const per = Number(x.perMonth), qty = Number(x.qty) || 0, months = qty / per, target = per * g, miss = Math.max(0, target - qty);
    return {x, per, qty, months, target, miss, pct: Math.min(1, months / g)};
  }).sort((a, b) => a.months - b.months);
}
function stockAsk(id) {
  const r = stockRows().find(r => r.x.id === id); if (!r) return;
  const pend = S.items.some(i => !i.bought && norm(i.name) === norm(r.x.name));
  if (pend) { alert(T('Já está na lista de compras.','Ya está en la lista de compras.')); return; }

const VEH_EMO = ['🚗','🛻','🏍️','🚲','🚌'];
const VKINDS = [['oleo','🛢️','Troca de óleo','Cambio de aceite'],['pneus','🛞','Pneus (calibrar/trocar)','Neumáticos (calibrar/cambiar)'],['freios','🛑','Freios','Frenos'],['bateria','🔋','Bateria','Batería'],['revisao','🔧','Revisão geral','Revisión general'],['docs','📄','Documentos / seguro / imposto','Documentos / seguro / impuesto'],['abastec','⛽','Abastecimento','Combustible'],['outro','🧰','Outro','Otro']];
const vkName = k => { const v = VKINDS.find(x => x[0] === k) || VKINDS[7]; return lang() === 'es' ? v[3] : v[2]; };
const vkIc = k => (VKINDS.find(x => x[0] === k) || VKINDS[7])[1];
function vehKm(v) { return Math.max(Number(v.km) || 0, ...D('vehcare').filter(c => c.veh === v.id).map(c => Number(c.km) || 0)); }
function vehDue(v) {
  const out = [], t = todayIso(), km = vehKm(v);
  VKINDS.forEach(k => {
    if (k[0] === 'abastec') return;
    const recs = D('vehcare').filter(c => c.veh === v.id && c.kind === k[0]).sort((a, b) => (a.date > b.date) - (a.date < b.date));
    const last = recs[recs.length - 1]; if (!last) return;
    const byDate = last.nextDate && last.nextDate <= addDays(t, 15), byKm = Number(last.nextKm) > 0 && km >= Number(last.nextKm) - 300;
    if (byDate || byKm) out.push({k: k[0], late: (last.nextDate && last.nextDate < t) || (Number(last.nextKm) > 0 && km >= Number(last.nextKm)), nextDate: last.nextDate, nextKm: last.nextKm});
  });
  return out;
}
function addVehicle() {
  const name = val('vname'); if (!name) { alert(T('Digite o nome do veículo.','Escriba el nombre del vehículo.')); return; }
  act(() => save('vehicles', {name: name.slice(0, 30), emo: val('vemo') || '🚗', plate: val('vplate').slice(0, 10).toUpperCase(), km: num('vkm'), resp: val('vresp') ? Number(val('vresp')) : ''}));
}
function vehKmSave(id) { const v = D('vehicles').find(x => x.id === id), km = num('vk' + id); if (v && km) act(() => save('vehicles', Object.assign(clean(v), {km}), {id})); }
function vehResp(id, r) { const v = D('vehicles').find(x => x.id === id); if (v) act(() => save('vehicles', Object.assign(clean(v), {resp: r ? Number(r) : ''}), {id})); }
function vehCareAdd(id) {
  if (!needMe()) return;
  const kind = val('vck' + id), date = val('vcd' + id) || todayIso(), cost = num('vcc' + id), km = num('vcm' + id), months = Number(val('vcn' + id) || 0), nkm = num('vcx' + id);
  let nextDate = ''; if (months > 0) { const d = parse(date); d.setMonth(d.getMonth() + months); nextDate = iso(d); }
  const v = D('vehicles').find(x => x.id === id) || {};
  act(async () => {
    await save('vehcare', {veh: id, kind, date, km, nextDate, nextKm: nkm && km ? km + nkm : 0, by: byMe(), cost, note: val('vct' + id).slice(0, 80)});
    if (km && km > (Number(v.km) || 0)) await save('vehicles', Object.assign(clean(v), {km}), {id});
    if (cost > 0) await api('expenses', 'POST', {member_id: byMe(), amount: cost, kind: 'transporte', note: vkName(kind) + ' ' + (v.name || ''), date: todayIso()});
  });
}
function vehDel(id) { if (confirm(T('Apagar este veículo e o histórico?','¿Borrar este vehículo y su historial?'))) act(async () => { for (const c of D('vehcare').filter(x => x.veh === id)) await del('vehcare', c.id); await del('vehicles', id); }); }

function budgetOf(k) { return Number((dk('budgets', k) || {}).limit) || 0; }
function saveBudget(k) { const v = num('bl-' + k); act(() => save('budgets', {limit: v}, {key: k})); }
function budgetStatus() {
  const ym = todayIso().slice(0, 7), spent = {};
  S.expenses.filter(e => e.date.startsWith(ym)).forEach(e => spent[e.kind] = (spent[e.kind] || 0) + e.amount);
  return Object.keys(KINDS).map(k => ({k, spent: spent[k] || 0, limit: budgetOf(k)})).filter(x => x.limit > 0 || x.spent > 0);
}
function budgetsHtml() {
  const rows = budgetStatus();
  let h = `<div class="card"><h2>${T('Controle de gastos por categoria','Control de gastos por categoría')}</h2><div class="mut" style="margin-bottom:8px">${T('Defina um limite mensal por categoria e acompanhe o quanto já foi usado.','Defina un límite mensual por categoría y siga cuánto se usó.')}</div>`;
  if (!rows.length) h += `<div class="empty">${T('Sem gastos neste mês.','Sin gastos este mes.')}</div>`;
  rows.forEach(r => {
    const pc = r.limit ? Math.round(100 * r.spent / r.limit) : 0, cls = !r.limit ? '' : pc >= 100 ? 'bad' : pc >= 80 ? 'warn' : '';
    h += `<div style="margin:12px 0"><div class="split-head" style="margin-bottom:4px"><b>${kindName(r.k)}</b><span class="mini">${gs(r.spent)}${r.limit ? ' / ' + gs(r.limit) + ' · ' + pc + '%' : ''}</span></div>${r.limit ? `<div class="bar ${cls}"><i style="width:${Math.min(100, pc)}%"></i></div>` : ''}</div>`;
  });
  if (token) h += `<details><summary style="font-weight:800;cursor:pointer">${T('Definir limites','Definir límites')}</summary>` + Object.keys(KINDS).map(k => `<div class="f2" style="grid-template-columns:1fr 1fr auto;margin-top:6px;align-items:center"><span>${kindName(k)}</span><input id="bl-${k}" inputmode="numeric" value="${budgetOf(k) || ''}" placeholder="Gs"><button class="btn o s" onclick="saveBudget('${k}')">OK</button></div>`).join('') + `</details>`;
  return h + `</div>`;
}

function joinToggle(coll, id) {
  if (!needMe()) return;
  const d = D(coll).find(x => x.id === id); if (!d) return;
  const h = d.helpers || [], m = byMe();
  const next = h.includes(m) ? h.filter(x => x !== m) : h.concat([m]);
  act(() => save(coll, Object.assign(clean(d), {helpers: next}), {id}));
}
function collabLine(d, coll) {
  const on = (d.helpers || []).includes(byMe());
  return `<div class="mini" style="margin-top:8px">${T('Colaboradores: ','Colaboradores: ')}<b>${(d.helpers || []).length ? d.helpers.map(x => esc(first(x))).join(', ') : '—'}</b> <button class="btn ${on ? 'g' : 'o'} s" style="margin-left:6px" onclick="joinToggle('${coll}',${d.id})">${on ? T('Colaboro','Colaboro') + ' ✓' : T('Quero colaborar','Quiero colaborar')}</button></div>`;
}

    {n: T('Completar o estoque da meta','Completar el stock de la meta'), v: sum(stockRows(), r => r.miss * (Number(r.x.price) || 0)), go: "foodSub='estoque';go('comida')"},

  ];

};
const EMO_MAP = {};
Object.keys(EMO).forEach(k => [...EMO[k]].forEach(ch => { EMO_MAP[ch] = k; }));
const EMO_RE = /(?:\p{Extended_Pictographic}|⌂)️?/gu;
const icon = n => '<svg class="gi" viewBox="0 0 16 16" aria-hidden="true">' + IC[n] + '</svg>';
function deEmoji(html) {
  let inOpt = 0, inText = 0;
  return html.split(/(<[^>]*>)/).map(tok => {
    if (!tok) return tok;
    if (tok[0] === '<') {
      if (/^<option\b/i.test(tok)) inOpt = 1; else if (/^<\/option/i.test(tok)) inOpt = 0;
      if (/^<text\b/i.test(tok)) inText = 1; else if (/^<\/text/i.test(tok)) inText = 0;
      return tok.replace(EMO_RE, '');
    }
    if (inOpt) return tok.replace(EMO_RE, '');
    if (inText) return tok.replace(/❗️?/g, '!').replace(EMO_RE, '');
    return tok.replace(EMO_RE, m => { const n = EMO_MAP[m.replace(/️/g, '')]; return n ? icon(n) : ''; });
  }).join('');
}

const WK_KINDS = [['build','🏗️','Construir','Construir'],['expand','📐','Ampliar','Ampliar'],['reform','🔨','Reformar','Reformar'],['fix','🛠️','Consertar','Arreglar'],['wall','🧱','Mudar parede ou cômodo','Cambiar pared o ambiente'],['paint','🎨','Pintar','Pintar'],['install','🔌','Instalar','Instalar']];
const WK_STATUS = [['plan','Planejando','Planificando','unk'],['doing','Em andamento','En marcha','fixing'],['paused','Pausada','Pausada','watch'],['done','Concluída','Terminada','ok']];
const WK_COST = [['material','Material','Material'],['labor','Mão de obra','Mano de obra'],['permit','Taxas e licenças','Tasas y licencias'],['other','Outros','Otros']];
const wkKind = k => WK_KINDS.find(x => x[0] === k) || WK_KINDS[2];
const wkStatus = s => WK_STATUS.find(x => x[0] === s) || WK_STATUS[0];
const wkCostName = k => { const c = WK_COST.find(x => x[0] === k) || WK_COST[3]; return lang() === 'es' ? c[2] : c[1]; };

function workInfo(w) {
  const costs = D('workcost').filter(c => Number(c.work) === Number(w.id));
  const spent = costs.reduce((n, c) => n + (Number(c.amount) || 0), 0);
  const budget = Number(w.budget) || 0;
  const steps = w.steps || [], done = steps.filter(s => s.done).length;
  const stepPct = steps.length ? Math.round(done / steps.length * 100) : (w.status === 'done' ? 100 : 0);
  const open = w.status !== 'done';
  return {
    costs, spent, budget, left: budget ? Math.max(0, budget - spent) : 0, over: budget > 0 && spent > budget,
    pct: budget ? Math.round(spent / budget * 100) : 0, steps, done, stepPct,
    late: open && !!w.end && w.end < todayIso(), open
  };
}
function worksTotals() {
  const list = D('works'), infos = list.map(workInfo);
  return {
    count: list.length, active: list.filter(w => w.status === 'doing').length,
    budget: infos.reduce((n, i) => n + i.budget, 0), spent: infos.reduce((n, i) => n + i.spent, 0),
    toSpend: list.reduce((n, w, i) => n + (infos[i].open ? infos[i].left : 0), 0)
  };
}
// ---- terreno e áreas ----
const landCfg = () => dk('flags', 'landcfg') || {};
function landStats() {
  const p = propInfo(), cfg = landCfg();
  const land = Number(p.land) || 0, built = Number(p.built) || 0;
  const open = D('works').filter(w => w.status !== 'done' && (w.kind === 'build' || w.kind === 'expand'));
  const planned = open.reduce((n, w) => n + (Number(w.area) || 0), 0);
  const after = built + planned, maxOcc = Number(cfg.maxocc) || 0;
  return {
    land, built, free: Math.max(0, land - built), occ: land ? Math.round(built / land * 100) : 0,
    planned, after, afterFree: land - after, afterOcc: land ? Math.round(after / land * 100) : 0,
    maxOcc, maxBuild: maxOcc && land ? Math.round(land * maxOcc / 100) : 0, m2: Number(cfg.m2) || 0,
    over: land > 0 && after > land, overMax: maxOcc > 0 && land > 0 && after / land * 100 > maxOcc,
    estCost: planned * (Number(cfg.m2) || 0)
  };
}
function landSave() { act(() => save('flags', {maxocc: dec('lc_max'), m2: num('lc_m2')}, {key: 'landcfg'})); }
function workCalc(id) {
  const area = dec('wa' + id), m2 = num('wm' + id) || landCfg().m2 || 0;
  if (!area || !m2) { alert(T('Informe a área (m²) e o custo por m².','Informe el área (m²) y el costo por m².')); return; }
  act(() => workPatch(id, {area, budget: Math.round(area * m2)}));
}
function addWork() {

  act(() => save('works', {

    budget: num('wk_budget') || Math.round(dec('wk_area') * (num('wk_m2') || landCfg().m2 || 0)), start: val('wk_start'), end: val('wk_end'), resp: val('wk_resp') ? Number(val('wk_resp')) : '',
    vendor: val('wk_vendor').slice(0, 40), note: val('wk_note').slice(0, 160), steps: [], created: todayIso(), area: dec('wk_area'), model: sketchId(val('wk_model'))
  }));
}
function workPatch(id, patch) { const w = D('works').find(x => x.id === id); if (w) return save('works', Object.assign(clean(w), patch), {id}); }
function workStatusSet(id, st) {
  const w = D('works').find(x => x.id === id); if (!w) return;
  act(async () => {

    if (st === 'done' && w.part) {

  const w = D('works').find(x => x.id === id); if (!w) return;
  act(() => workPatch(id, {steps: (w.steps || []).concat([{t: t.slice(0, 80), done: false}])}));

function workStepToggle(id, i) {

  const steps = (w.steps || []).map((s, j) => j === i ? Object.assign({}, s, {done: !s.done}) : s);

}
function workStepDel(id, i) {

function activity(fromIso, toIso, fromMs, toMs) {
  const stats = activeMembers().map(m => ({id: m.id, name: m.name, bought: 0, paid: 0, requests: 0, records: 0, tasks: 0, fixes: 0, cooked: 0, shops: 0, saved: 0, bills: 0}));
  const idx = new Map(stats.map(x => [x.id, x]));
  const inD = d => d && d >= fromIso && d < toIso;
  (S.items || []).forEach(i => {
    if (i.bought && i.bought_at >= fromMs && i.bought_at < toMs && idx.has(i.bought_by)) idx.get(i.bought_by).bought++;
    if (i.created >= fromMs && i.created < toMs && idx.has(i.added_by)) idx.get(i.added_by).requests++;
  });
  (S.expenses || []).forEach(e => {
    if (e.date >= fromIso && e.date < toIso && idx.has(e.member_id)) { idx.get(e.member_id).paid += Number(e.amount) || 0; idx.get(e.member_id).records++; }
  });
  D('fixlog').forEach(l => { if (inD(l.date) && idx.has(Number(l.by))) idx.get(Number(l.by))[l.type === 'fix' ? 'fixes' : 'tasks']++; });
  D('meallog').forEach(l => { const d = (l.key || '').split('|')[0]; if (l.done && inD(d) && idx.has(Number(l.doneBy || l.cook))) idx.get(Number(l.doneBy || l.cook)).cooked++; });
  D('shops').forEach(s => { if (inD(s.date) && idx.has(Number(s.who))) idx.get(Number(s.who)).shops++; });
  D('goalpay').forEach(p => { if (inD(p.date) && idx.has(Number(p.m))) idx.get(Number(p.m)).saved++; });
  D('billpay').forEach(p => { if (inD(p.date) && idx.has(Number(p.by))) idx.get(Number(p.by)).bills++; });
  const helpsOf = c => D(c).forEach(d => (d.helpers || []).forEach(m => { if (idx.has(Number(m)) && inD((d.updated ? iso(new Date(d.updated)) : ''))) idx.get(Number(m)).helps++; }));
  stats.forEach(x => { x.helps = 0; });
  ['chores','pets','vehicles','bills','works'].forEach(helpsOf);
  stats.forEach(x => { x.total = x.bought + x.records + x.tasks + x.fixes + x.cooked + x.shops + x.saved + x.bills + x.helps; });
  return stats;
}
function collaborationSummary() {
  const start = monday(new Date());
  const end = new Date(start); end.setDate(end.getDate() + 7);
  const stats = activity(iso(start), iso(end), start.getTime(), end.getTime());
  return {start, stats, participated: stats.filter(x => x.total > 0).length, participants: stats.length};
}
function monthActivity() {
  const end = new Date(); end.setDate(end.getDate() + 1); end.setHours(0, 0, 0, 0);
  const start = new Date(end); start.setDate(start.getDate() - 30);
  return activity(iso(start), iso(end), start.getTime(), end.getTime());
}
