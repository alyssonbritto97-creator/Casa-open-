name: Compilar Casa+

# Como usar: suba o arquivo Z-Casa-Converta.zip na raiz do repositório.
# Ele compila sozinho. Depois, em Actions, abra a execução verde e baixe "Casa-APK" em Artifacts.

on:
  workflow_dispatch:
  push:
    paths:
      - "Z-Casa-Converta.zip"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descompactar o projeto
        run: |
          mkdir -p _src
          unzip -q Z-Casa-Converta.zip -d _src
          echo "PROJ=_src/$(ls _src | head -n1)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compilar as páginas Next.js (opcional)
        continue-on-error: true
        run: |
          cd "$PROJ/web"
          npm install --no-audit --no-fund
          npm run build
          mkdir -p ../app/src/main/assets/next
          cp -r out/. ../app/src/main/assets/next/

      - name: Compilar
        run: |
          cd "$PROJ"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Reunir o APK
        run: |
          mkdir -p apk
          cp "$PROJ"/app/build/outputs/apk/debug/app-debug.apk apk/Casa-Converta.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Casa-APK
          path: apk/Casa-Converta.apk
