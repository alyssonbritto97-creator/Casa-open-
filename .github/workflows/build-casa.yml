name: Compilar Open House

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-casa.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Compilar APK Android
        shell: bash
        run: |
          cd source/CasaConverta
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle :app:assembleDebug --no-daemon --max-workers=2 --stacktrace
      - name: Preparar download
        shell: bash
        run: |
          mkdir -p apk
          cp source/CasaConverta/app/build/outputs/apk/debug/app-debug.apk apk/Open-House-debug.apk
          test -s apk/Open-House-debug.apk
          ls -lh apk/
      - uses: actions/upload-artifact@v4
        with:
          name: Casa-APK
          path: apk/Open-House-debug.apk
          if-no-files-found: error
          retention-days: 30

