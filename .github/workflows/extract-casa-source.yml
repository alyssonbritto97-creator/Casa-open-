name: Preparar fonte editável Casa+
on:
  push:
    branches: [feat/casa-compras-despesas-20261103]
    paths: [.github/workflows/extract-casa-source.yml]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extração protegida do código de origem
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .unpacked source/CasaConverta
          unzip -q Z-Casa-Converta.zip -d .unpacked
          test -f .unpacked/CasaConverta/settings.gradle.kts
          rsync -a --exclude '.gradle' --exclude 'build' --exclude 'local.properties' --exclude '.idea' --exclude '*.apk' --exclude '*.jks' --exclude '*.keystore' --exclude '*.env' .unpacked/CasaConverta/ source/CasaConverta/
          git status --short | head -90
      - name: Salvar código editável na ramificação
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add source/CasaConverta
          if ! git diff --cached --quiet; then
            git commit -m "chore(casa): extract editable Android source from legacy ZIP"
            git push
          fi
